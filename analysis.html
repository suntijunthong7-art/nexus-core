header{

.container{
padding:20px;
}

.log{
background:#000;

}

<body>

<header>

<div>Virus Analysis</div>

<button onclick="location.href='dashboard.html'">Back</button>

</header>

<div class="container">

<h3>System Log</h3>

<div class="log" id="log"></div>

</div>

<script>

let log=document.getElementById("log")

let msgs=[
"Scanning viral particles",
"DNA mutation detected",
"Protein analysis running",
"Host cell mapping",
"Genome sequencing"
]

setInterval(()=>{

let time=new Date().toLocaleTimeString()

let m=msgs[Math.floor(Math.random()*msgs.length)]

log.innerHTML+="["+time+"] "+m+"<br>"

log.scrollTop=log.scrollHeight

},2000)

</script>

</body>
