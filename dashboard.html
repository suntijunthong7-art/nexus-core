<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXUS LAB</title>

<style>

body{
margin:0;
font-family:Arial;
background:#020e13;
color:#d4edf2;
}

header{
padding:20px;
border-bottom:1px solid #0f2e35;
}

h1{
margin:0;
letter-spacing:3px;
}

.container{
padding:20px;
}

.panel{
background:#06161c;
border:1px solid #10343c;
border-radius:12px;
padding:20px;
margin-bottom:20px;
}

.button{
display:inline-block;
padding:10px 18px;
background:#0f8f8a;
border-radius:6px;
color:white;
text-decoration:none;
}

.console{
background:black;
color:#3cff9a;
padding:15px;
font-family:monospace;
font-size:13px;
border-radius:8px;
margin-top:10px;
height:200px;
overflow:auto;
}

</style>

</head>

<body>

<header>

<h1>NEXUS CORE LAB</h1>

</header>

<div class="container">

<div class="panel">

<h3>Bio Experiment Console</h3>

<div id="console" class="console"></div>

</div>

<div class="panel">

<h3>Lab Control</h3>

<button class="button" onclick="runExperiment()">
Run Experiment
</button>

<a class="button" href="index.html">
Return Dashboard
</a>

</div>

</div>

<script>

let logs=[
"Initializing bio scanner...",
"DNA sequencing started",
"Virus genome detected",
"AI mutation prediction running",
"Lab containment verified",
"Sample analysis complete"
]

function runExperiment(){

let consoleBox=document.getElementById("console")

let text=logs[Math.floor(Math.random()*logs.length)]

let div=document.createElement("div")

div.innerText="> "+text

consoleBox.appendChild(div)

consoleBox.scrollTop=consoleBox.scrollHeight

}

</script>

</body>
</html>
