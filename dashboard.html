<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXUS CORE AI</title>

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#021017;
color:#cfe6ec;
}

header{
padding:18px;
border-bottom:1px solid #12323a;
}

h1{
margin:0;
letter-spacing:3px;
font-size:22px;
}

nav{
margin-top:8px;
}

nav a{
color:#7aa5ad;
margin-right:18px;
text-decoration:none;
font-size:14px;
}

nav a:hover{
color:#49d6a7;
}

.status{
text-align:center;
color:#49d6a7;
padding:10px;
border-bottom:1px solid #12323a;
font-size:13px;
}

.container{
padding:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-bottom:25px;
}

.card{
background:#051820;
border:1px solid #10333b;
border-radius:12px;
padding:18px;
}

.card h3{
margin:0;
font-size:13px;
color:#7fa9b1;
}

.value{
margin-top:8px;
font-size:22px;
}

.section{
margin-top:25px;
}

.section h2{
font-size:16px;
margin-bottom:10px;
color:#9cc6ce;
}

.panel{
background:#04141a;
border:1px solid #10333b;
border-radius:12px;
padding:18px;
}

.activity div{
padding:6px 0;
border-bottom:1px solid rgba(255,255,255,0.05);
font-size:13px;
color:#9dbcc2;
}

.time{
text-align:center;
margin-top:20px;
color:#8db6be;
font-size:13px;
}

</style>

</head>

<body>

<header>

<h1>NEXUS CORE</h1>

<nav>
<a href="#">Dashboard</a>
<a href="lab.html">Laboratories</a>
<a href="#">Research Network</a>
<a href="#">Security</a>
<a href="#">Logs</a>
</nav>

</header>

<div class="status">
SYSTEM STATUS : OPERATIONAL • NETWORK SECURE • AI MONITOR ACTIVE
</div>

<div class="container">

<div class="grid">

<div class="card">
<h3>Active Labs</h3>
<div class="value">14</div>
</div>

<div class="card">
<h3>Samples Processing</h3>
<div class="value">327</div>
</div>

<div class="card">
<h3>Network Nodes</h3>
<div class="value">42</div>
</div>

<div class="card">
<h3>AI Monitoring</h3>
<div class="value">ONLINE</div>
</div>

</div>

<div class="section">

<h2>System Activity</h2>

<div class="panel">
<div class="activity" id="log"></div>
</div>

</div>

<div class="time">
SERVER TIME : <span id="time"></span>
</div>

</div>

<script>

/* CLOCK */

function updateTime(){

let now=new Date()

let h=String(now.getHours()).padStart(2,'0')
let m=String(now.getMinutes()).padStart(2,'0')
let s=String(now.getSeconds()).padStart(2,'0')

document.getElementById("time").innerText=h+":"+m+":"+s

}

setInterval(updateTime,1000)
updateTime()


/* LOG SYSTEM */

let logs=[
"Genome Data Uploaded",
"AI Scan Completed",
"Lab Node Connected",
"Secure Channel Verified",
"Network Sync Completed",
"Bio Sample Analysis Running"
]

function addLog(){

let time=new Date().toLocaleTimeString()

let text=time+" • "+logs[Math.floor(Math.random()*logs.length)]

let div=document.createElement("div")
div.innerText=text

let logBox=document.getElementById("log")

logBox.prepend(div)

if(logBox.children.length>6){
logBox.removeChild(logBox.lastChild)
}

}

setInterval(addLog,4000)

</script>

</body>
</html>
