<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexus Core Lab</title>

<style>

body{
margin:0;
font-family:system-ui;
background:#060606;
color:white;
}

.header{
padding:20px;
border-bottom:1px solid #1a1a1a;
}

.header h2{
margin:0;
font-size:18px;
letter-spacing:1px;
}

.header span{
font-size:12px;
color:#7c7c7c;
}

.container{
padding:18px;
max-width:900px;
margin:auto;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:20px;
}

.card{
background:rgba(20,20,20,0.9);
padding:18px;
border-radius:12px;
border:1px solid #1c1c1c;
}

.card h4{
font-size:11px;
color:#7c7c7c;
margin:0;
}

.card p{
font-size:16px;
margin-top:6px;
}

.preview{
margin-top:25px;
border-radius:12px;
overflow:hidden;
border:1px solid #1c1c1c;
}

.preview video{
width:100%;
height:200px;
object-fit:cover;
}

.button{
margin-top:22px;
width:100%;
padding:14px;
background:#0f766e;
border:none;
border-radius:12px;
color:white;
font-size:15px;
letter-spacing:.5px;
}

.button:hover{
background:#0c5f59;
}

.footer{
text-align:center;
font-size:11px;
color:#6a6a6a;
margin-top:25px;
}

</style>
</head>

<body>

<div class="header">

<h2>NEXUS CORE LAB</h2>
<span>National Bio Defense System</span>

</div>

<div class="container">

<div class="grid">

<div class="card">
<h4>GLOBAL NODES</h4>
<p>14 Active</p>
</div>

<div class="card">
<h4>SYSTEM LOAD</h4>
<p>38%</p>
</div>

<div class="card">
<h4>NETWORK STATUS</h4>
<p>ONLINE</p>
</div>

<div class="card">
<h4>LAST LOG</h4>
<p>Genome scan completed</p>
</div>

</div>

<div class="preview">

<video autoplay muted loop playsinline>
<source src="video/lab.mp4" type="video/mp4">
</video>

</div>

<button class="button" onclick="enterLab()">
Enter Laboratory
</button>

<div class="footer">
Secure Bio Research Network
</div>

</div>

<script>

function enterLab(){
window.location.href="lab.html"
}

</script>

</body>
</html>
