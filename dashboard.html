<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Nexus Core Lab</title>

<style>

body{
margin:0;
font-family:system-ui;
background:#050505;
color:white;
}

.header{
padding:22px;
border-bottom:1px solid #1c1c1c;
}

.header h2{
margin:0;
font-size:18px;
}

.header span{
font-size:12px;
color:#777;
}

.container{
padding:18px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:15px;
}

.card{
background:#111;
padding:18px;
border-radius:12px;
border:1px solid #1b1b1b;
}

.card h4{
font-size:11px;
color:#777;
margin:0;
}

.card p{
margin-top:5px;
font-size:15px;
}

.section{
margin-top:25px;
}

.section h3{
font-size:13px;
color:#888;
margin-bottom:10px;
}

.activity{
background:#111;
border-radius:12px;
padding:15px;
border:1px solid #1b1b1b;
font-size:13px;
line-height:1.7;
color:#aaa;
}

.button{
margin-top:25px;
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#14746f;
color:white;
font-size:15px;
}

.footer{
text-align:center;
font-size:11px;
color:#666;
margin-top:20px;
}

</style>
</head>

<body>

<div class="header">

<h2>NEXUS CORE LAB</h2>
<span>National Bio Defense System</span>

</div>

<div class="container">

<div class="grid">

<div class="card">
<h4>GLOBAL NODES</h4>
<p>14 Active</p>
</div>

<div class="card">
<h4>SYSTEM LOAD</h4>
<p>38%</p>
</div>

<div class="card">
<h4>NETWORK STATUS</h4>
<p>ONLINE</p>
</div>

<div class="card">
<h4>LAST LOG</h4>
<p>Genome Scan</p>
</div>

</div>

<div class="section">

<h3>Recent Activity</h3>

<div class="activity">
• Genome scan completed<br>
• Bio sample analysis running<br>
• Network security check passed<br>
• Lab node synchronization complete
</div>

</div>

<button class="button" onclick="enterLab()">
ENTER LAB
</button>

<div class="footer">
Secure Research Network
</div>

</div>

<script>

function enterLab(){
window.location.href="lab.html"
}

</script>

</body>
</html>
