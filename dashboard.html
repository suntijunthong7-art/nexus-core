<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Dashboard</title>

<style>

body{
margin:0;
font-family:Arial;
background:#071b22;
color:#8feaff;
}

header{
padding:15px;
background:#0b2f38;
display:flex;
justify-content:space-between;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
padding:20px;
}

.card{
background:#0c2530;
padding:10px;
border:1px solid #10414e;
}

img,video{
width:100%;
}

button{
margin-top:10px;
padding:8px;
background:#0fa8c5;
border:none;
color:white;
}

</style>

</head>

<body>

<header>

<div>Laboratory Monitoring</div>

<div>SYSTEM ACTIVE</div>

</header>

<div class="grid">

<div class="card">

<h3>DNA Visualization</h3>

<video autoplay loop muted>
<source src="dna.mp4">
</video>

</div>

<div class="card">

<h3>Virus Model</h3>

<img src="virus-3d.png">

</div>

<div class="card">

<h3>Infected Cell</h3>

<img src="infected-cell.png">

</div>

<div class="card">

<h3>Virus Structure</h3>

<video autoplay loop muted>
<source src="virus-structure.mp4">
</video>

</div>

<div class="card">

<h3>Analysis</h3>

<button onclick="location.href='analysis.html'">

Open Analysis

</button>

</div>

</div>

</body>
</html>
