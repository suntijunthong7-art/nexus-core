<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>National Bio Defense Command</title>

<!-- CDN Libraries -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#021416;
color:#e8ffff;
}

/* GRID BACKGROUND */

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,255,200,0.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,255,200,0.05) 1px, transparent 1px);
background-size:40px 40px;
z-index:-1;
}

/* HEADER */

.header{
padding:20px;
border-bottom:1px solid rgba(0,255,200,0.2);
}

h1{
margin:0;
font-size:24px;
}

.status{
color:#00ffc8;
margin-top:6px;
}

/* MAP */

.map{
height:260px;
}

/* DASHBOARD GRID */

.dashboard{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
padding:20px;
}

.card{
background:rgba(0,60,60,0.4);
border:1px solid rgba(0,255,200,0.2);
border-radius:10px;
padding:15px;
}

.title{
font-size:12px;
color:#8fbebe;
}

.value{
font-size:22px;
margin-top:5px;
}

/* LOG */

.log{
height:120px;
overflow:auto;
font-family:monospace;
font-size:12px;
color:#a8e6d8;
}

/* BUTTON */

.lab{
padding:20px;
}

button{
width:100%;
padding:16px;
background:#00e6a6;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
color:black;
}

button:hover{
background:#00c18d;
cursor:pointer;
}

</style>
</head>

<body>

<div class="header">

<h1>NATIONAL BIO DEFENSE COMMAND</h1>

<div class="status">
Threat Level : GREEN | Server Time : <span id="clock"></span>
</div>

</div>

<div id="worldmap" class="map"></div>

<div class="dashboard">

<div class="card">
<div class="title">GLOBAL SURVEILLANCE</div>
<div class="value" id="nodes">16 Nodes Active</div>
</div>

<div class="card">
<div class="title">SYSTEM LOAD</div>
<canvas id="cpuChart"></canvas>
</div>

<div class="card">
<div class="title">THREAT ANALYSIS</div>
<div class="value" id="threat">No outbreak detected</div>
</div>

<div class="card">
<div class="title">DEFENSE NETWORK</div>
<div class="value">ONLINE</div>
</div>

<div class="card">
<div class="title">SYSTEM LOG</div>
<div class="log" id="log"></div>
</div>

</div>

<div class="lab">
<button onclick="enterLab()">ENTER RESEARCH LAB</button>
</div>

<script>

/* CLOCK */

setInterval(()=>{

document.getElementById("clock").innerText=
new Date().toLocaleTimeString()

},1000)

/* NODES */

setInterval(()=>{

let n=14+Math.floor(Math.random()*6)

document.getElementById("nodes").innerText=n+" Nodes Active"

},4000)

/* WORLD MAP */

var chart = echarts.init(document.getElementById('worldmap'));

var option = {

backgroundColor:"#021416",

geo:{
map:'world',
roam:true,
itemStyle:{
areaColor:"#083333",
borderColor:"#00ffc8"
}
},

series:[{
type:"scatter",
coordinateSystem:"geo",
data:[
{value:[100.5,13.7]},
{value:[139.6,35.6]},
{value:[-74,40.7]},
{value:[2.35,48.85]}
],
symbolSize:8,
itemStyle:{color:"#00ff9c"}
}]

};

chart.setOption(option);

/* CPU CHART */

const ctx = document.getElementById('cpuChart');

const cpuChart = new Chart(ctx,{

type:'line',

data:{
labels:["1","2","3","4","5","6"],
datasets:[{
data:[35,38,40,36,34,39],
borderColor:"#00ffc8",
backgroundColor:"transparent",
tension:0.4
}]
},

options:{
plugins:{legend:{display:false}},
scales:{x:{display:false},y:{display:false}}
}

});

/* LOG STREAM */

let log=document.getElementById("log")

function addLog(){

let events=[

"Satellite node synced",
"Bio sensor online",
"Threat scan completed",
"Neural analysis running",
"Genome sample processing"

]

let e=events[Math.floor(Math.random()*events.length)]

let t=new Date().toLocaleTimeString()

log.innerHTML="[ "+t+" ] "+e+"<br>"+log.innerHTML

}

setInterval(addLog,2000)

/* LAB */

function enterLab(){

window.location="lab.html"

}

</script>

</body>
</html>
