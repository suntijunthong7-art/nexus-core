<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Nexus Bio Defense Command</title>

<style>

body{
margin:0;
font-family:Arial;
background:#021416;
color:#dfffff;
}

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,255,200,0.06) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,255,200,0.06) 1px, transparent 1px);
background-size:40px 40px;
z-index:-1;
}

.header{
padding:20px;
border-bottom:1px solid rgba(0,255,200,0.2);
}

h1{
margin:0;
font-size:26px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
padding:20px;
}

.card{
background:rgba(0,60,60,0.4);
border:1px solid rgba(0,255,200,0.2);
border-radius:12px;
padding:15px;
}

.title{
font-size:13px;
color:#88bbbb;
}

.value{
font-size:22px;
margin-top:5px;
}

.log{
font-family:monospace;
font-size:12px;
}

button{
width:100%;
padding:16px;
background:#00e6a6;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
margin:20px;
}

</style>

</head>

<body>

<div class="header">

<h1>NATIONAL BIO DEFENSE COMMAND</h1>
<div>Threat Level : GREEN</div>

</div>

<div class="grid">

<div class="card">
<div class="title">SERVER TIME</div>
<div class="value" id="time">loading...</div>
</div>

<div class="card">
<div class="title">PUBLIC IP</div>
<div class="value" id="ip">loading...</div>
</div>

<div class="card">
<div class="title">ISS SATELLITE POSITION</div>
<div class="value" id="iss">loading...</div>
</div>

<div class="card">
<div class="title">WEATHER (BANGKOK)</div>
<div class="value" id="weather">loading...</div>
</div>

<div class="card">
<div class="title">NETWORK LATENCY</div>
<div class="value" id="ping">testing...</div>
</div>

<div class="card">

<div class="title">SYSTEM LOG</div>

<div class="log" id="log"></div>

</div>

</div>

<button onclick="enterLab()">ENTER BIO LAB</button>

<script>

/* WORLD TIME */

async function getTime(){

let res = await fetch("https://worldtimeapi.org/api/ip")

let data = await res.json()

document.getElementById("time").innerText =
data.datetime.slice(11,19)

}

getTime()
setInterval(getTime,10000)


/* IP ADDRESS */

fetch("https://api.ipify.org?format=json")
.then(res=>res.json())
.then(data=>{
document.getElementById("ip").innerText=data.ip
})


/* ISS SATELLITE */

async function iss(){

let res = await fetch("https://api.wheretheiss.at/v1/satellites/25544")

let data = await res.json()

document.getElementById("iss").innerText =
data.latitude.toFixed(2)+" , "+data.longitude.toFixed(2)

}

iss()
setInterval(iss,5000)


/* WEATHER */

async function weather(){

let res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=13.75&longitude=100.50&current_weather=true")

let data = await res.json()

document.getElementById("weather").innerText =
data.current_weather.temperature+"°C"

}

weather()


/* PING */

let start=performance.now()

fetch("https://api.github.com")

.then(()=>{

let latency=Math.floor(performance.now()-start)

document.getElementById("ping").innerText=latency+" ms"

})


/* LOG */

let log=document.getElementById("log")

function addLog(){

let events=[

"satellite link established",
"biosensor online",
"network scan completed",
"defense grid active",
"AI analysis running"

]

let e=events[Math.floor(Math.random()*events.length)]

let t=new Date().toLocaleTimeString()

log.innerHTML="[ "+t+" ] "+e+"<br>"+log.innerHTML

}

setInterval(addLog,2000)


/* LAB */

function enterLab(){

window.location="lab.html"

}

</script>

</body>

</html>
