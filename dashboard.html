<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>National Bio Defense Command</title>

<style>

body{
margin:0;
font-family:Arial;
background:#021416;
color:#e6ffff;
}

/* GRID BACKGROUND */

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,255,200,0.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,255,200,0.05) 1px, transparent 1px);
background-size:40px 40px;
z-index:-1;
}

/* HEADER */

.header{
padding:20px;
border-bottom:1px solid rgba(0,255,200,0.2);
}

h1{
margin:0;
font-size:24px;
}

.status{
margin-top:5px;
color:#00ffc8;
}

/* MAP */

.map{
height:200px;
background:url("https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg");
background-size:cover;
opacity:0.3;
position:relative;
}

.scan{
position:absolute;
height:2px;
width:100%;
background:#00ffc8;
box-shadow:0 0 10px #00ffc8;
animation:scan 4s linear infinite;
}

@keyframes scan{
0%{top:0}
100%{top:200px}
}

/* DASHBOARD GRID */

.dashboard{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
padding:20px;
}

.card{
background:rgba(0,60,60,0.4);
border:1px solid rgba(0,255,200,0.2);
border-radius:10px;
padding:15px;
}

.title{
font-size:13px;
color:#8fbebe;
}

.value{
font-size:22px;
margin-top:5px;
}

/* LOG */

.log{
height:120px;
overflow:auto;
font-family:monospace;
font-size:12px;
color:#a8e6d8;
}

/* BUTTON */

.lab{
padding:20px;
}

button{
width:100%;
padding:16px;
background:#00e6a6;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
color:black;
}

button:hover{
background:#00c18d;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

<h1>NATIONAL BIO DEFENSE COMMAND</h1>

<div class="status">

Threat Level : GREEN |
Server Time : <span id="clock"></span>

</div>

</div>

<div class="map">
<div class="scan"></div>
</div>

<div class="dashboard">

<div class="card">

<div class="title">GLOBAL SURVEILLANCE</div>
<div class="value" id="nodes">16 Nodes Active</div>

</div>

<div class="card">

<div class="title">SYSTEM LOAD</div>
<div class="value" id="cpu">CPU 38%</div>

</div>

<div class="card">

<div class="title">BIO SIGNAL MONITOR</div>
<div class="value" id="bio">Stable</div>

</div>

<div class="card">

<div class="title">THREAT ANALYSIS</div>
<div class="value" id="threat">No outbreak detected</div>

</div>

<div class="card">

<div class="title">DEFENSE NETWORK</div>
<div class="value">ONLINE</div>

</div>

<div class="card">

<div class="title">SYSTEM LOG</div>

<div class="log" id="log"></div>

</div>

</div>

<div class="lab">

<button onclick="enterLab()">ENTER RESEARCH LAB</button>

</div>

<script>

/* CLOCK */

function updateClock(){

let now=new Date()

document.getElementById("clock").innerText=
now.toLocaleTimeString()

}

setInterval(updateClock,1000)

/* NODES */

setInterval(()=>{

let n=14+Math.floor(Math.random()*6)

document.getElementById("nodes").innerText=n+" Nodes Active"

},4000)

/* CPU */

setInterval(()=>{

let cpu=30+Math.floor(Math.random()*20)

document.getElementById("cpu").innerText="CPU "+cpu+"%"

},3000)

/* BIOSIGNAL */

setInterval(()=>{

let states=["Stable","Monitoring","Analyzing"]

let s=states[Math.floor(Math.random()*states.length)]

document.getElementById("bio").innerText=s

},5000)

/* LOG */

let log=document.getElementById("log")

function addLog(){

let events=[

"Satellite node synced",
"Bio sensor online",
"Threat scan completed",
"Neural analysis running",
"Genome sample processing"

]

let e=events[Math.floor(Math.random()*events.length)]

let t=new Date().toLocaleTimeString()

log.innerHTML="[ "+t+" ] "+e+"<br>"+log.innerHTML

}

setInterval(addLog,2000)

/* ENTER LAB */

function enterLab(){

window.location="lab.html"

}

</script>

</body>
</html>
