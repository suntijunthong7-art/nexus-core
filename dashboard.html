<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>National Bio Defense Command</title>

<style>

body{
margin:0;
font-family:Arial;
background:#071417;
color:#dffffa;
}

/* HEADER */

header{
padding:20px;
background:#041012;
border-bottom:1px solid #00ffd0;
}

header h1{
font-size:20px;
margin:0;
letter-spacing:2px;
}

.threat{
color:#00ff8c;
font-weight:bold;
margin-top:8px;
}

/* IMAGE */

.hero{
width:100%;
height:260px;
overflow:hidden;
}

.hero img{
width:100%;
height:100%;
object-fit:cover;
}

/* GRID */

.grid{

display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
padding:15px;

}

.panel{

background:#0c2024;
border:1px solid #00ffd0;
border-radius:6px;
padding:12px;
font-size:13px;

}

/* MOBILE */

@media(max-width:700px){

.grid{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<header>

<h1>NATIONAL BIO DEFENSE COMMAND</h1>

<div class="threat">THREAT LEVEL : GREEN</div>

</header>

<div class="hero">

<img src="virus-3d.png">

</div>

<div class="grid">

<div class="panel">

<b>GLOBAL SURVEILLANCE</b><br>
Active Monitoring Network

</div>

<div class="panel">

<b>DEFENSE NETWORK</b><br>
Satellite Bio Detection Grid Online

</div>

<div class="panel">

<b>SYSTEM LOG</b><br>
Genome Scan Running

</div>

<div class="panel">

<b>LAB STATUS</b><br>
Containment Stable

</div>

</div>

</body>
</html>
