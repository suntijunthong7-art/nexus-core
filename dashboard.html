<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS CORE DASHBOARD</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#071b1f;
color:white;
}

.topbar{
background:#0f2d32;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:18px;
font-weight:bold;
letter-spacing:2px;
}

.container{
padding:30px;
}

.card{
background:#0f2d32;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

button{
padding:12px 18px;
border:none;
border-radius:8px;
background:#2f4158;
color:white;
font-size:14px;
cursor:pointer;
}

button:hover{
background:#1d2c3f;
}

.status{
margin-top:10px;
font-size:14px;
color:#8ad9b3;
}

</style>

</head>

<body>

<div class="topbar">
<div class="logo">NEXUS CORE</div>
</div>

<div class="container">

<div class="card">

<h3>AI System Monitor</h3>

<div id="aiStatus" class="status">
AI ANALYZING SYSTEM...
</div>

<br>

<button onclick="goLab()">
OPEN LAB CONTROL
</button>

</div>

</div>

<script>

function goLab(){
window.location="lab.html"
}


function aiMonitor(){

let status=[
"AI scanning network...",
"AI analyzing lab activity...",
"AI security check running...",
"AI monitoring system health...",
"AI anomaly detection active..."
]

let text=status[Math.floor(Math.random()*status.length)]

document.getElementById("aiStatus").innerText=text

}

setInterval(aiMonitor,4000)

</script>

</body>
</html>
