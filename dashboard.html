<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>National Bio Defense Command</title>

<style>

body{
margin:0;
font-family:Arial;
color:white;
background:black;
overflow-x:hidden;
}

/* VIDEO BACKGROUND */

.video-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-2;
overflow:hidden;
}

.video-bg iframe{
width:100vw;
height:100vh;
pointer-events:none;
border:none;
}

/* DARK OVERLAY */

.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.75);
z-index:-1;
}

/* HEADER */

.header{
padding:25px;
}

h1{
margin:0;
font-size:28px;
}

.threat{
color:#00ff9d;
margin-top:5px;
}

/* SCAN LINE */

.scan{
width:100%;
height:2px;
background:#00ffc8;
box-shadow:0 0 12px #00ffc8;
margin:10px 0;
}

/* DASHBOARD */

.dashboard{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
padding:20px;
}

.card{
background:rgba(0,60,60,0.6);
border:1px solid rgba(0,255,200,0.3);
border-radius:12px;
padding:18px;
backdrop-filter:blur(6px);
}

.label{
font-size:12px;
color:#9ed9d9;
}

.big{
font-size:24px;
margin-top:5px;
}

.log{
height:120px;
overflow:auto;
font-family:monospace;
font-size:12px;
}

/* BUTTON */

.lab{
padding:20px;
}

button{
width:100%;
padding:16px;
background:#00e6a6;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
color:black;
}

button:hover{
background:#00c18d;
cursor:pointer;
}

</style>

</head>

<body>

<div class="video-bg">

<iframe src="https://www.youtube.com/embed/XBPjVzSoepo?autoplay=1&mute=1&loop=1&playlist=XBPjVzSoepo"></iframe>

</div>

<div class="overlay"></div>

<div class="header">

<h1>NATIONAL BIO DEFENSE COMMAND</h1>

<div class="threat">
Threat Level : GREEN
</div>

</div>

<div class="scan"></div>

<div class="dashboard">

<div class="card">

<div class="label">GLOBAL SURVEILLANCE</div>
<div class="big" id="nodes">16 Nodes Active</div>

</div>

<div class="card">

<div class="label">SYSTEM LOAD</div>
<div class="big" id="cpu">CPU 38%</div>

</div>

<div class="card">

<div class="label">DEFENSE NETWORK</div>
<div class="big">ONLINE</div>

</div>

<div class="card">

<div class="label">SYSTEM LOG</div>
<div class="log" id="log"></div>

</div>

</div>

<div class="lab">

<button onclick="enterLab()">ENTER BIO LAB</button>

</div>

<script>

/* nodes */

setInterval(()=>{

let n=14+Math.floor(Math.random()*6)

document.getElementById("nodes").innerText=n+" Nodes Active"

},4000)

/* cpu */

setInterval(()=>{

let cpu=30+Math.floor(Math.random()*20)

document.getElementById("cpu").innerText="CPU "+cpu+"%"

},3000)

/* log */

let log=document.getElementById("log")

function addLog(){

let events=[
"Satellite node synced",
"Orbital scan completed",
"Bio sensor active",
"Threat analysis running",
"Genome sample processing"
]

let e=events[Math.floor(Math.random()*events.length)]

let t=new Date().toLocaleTimeString()

log.innerHTML="[ "+t+" ] "+e+"<br>"+log.innerHTML

}

setInterval(addLog,2000)

/* lab */

function enterLab(){

window.location="lab.html"

}

</script>

</body>
</html>
