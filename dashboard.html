<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>National Bio Defense Command</title>

<style>

body{
margin:0;
font-family:Arial;
color:white;
background:#021416;
}

/* GRID */

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,255,200,0.07) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,255,200,0.07) 1px, transparent 1px);
background-size:40px 40px;
z-index:-1;
}

/* HEADER */

.header{
padding:25px;
}

h1{
margin:0;
font-size:28px;
}

.threat{
color:#00ff9d;
margin-top:5px;
}

/* MAP */

.map{
height:180px;
background:url("https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg");
background-size:cover;
opacity:0.35;
position:relative;
}

.scan{
position:absolute;
height:2px;
width:100%;
background:#00ffc8;
box-shadow:0 0 10px #00ffc8;
animation:scan 4s linear infinite;
}

@keyframes scan{
0%{top:0}
100%{top:180px}
}

/* DASHBOARD */

.dashboard{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
padding:20px;
}

.card{
background:rgba(0,60,60,0.5);
border:1px solid rgba(0,255,200,0.2);
border-radius:12px;
padding:18px;
}

.label{
font-size:12px;
color:#89b5b5;
}

.big{
font-size:26px;
margin-top:5px;
}

.log{
height:120px;
overflow:auto;
font-family:monospace;
font-size:12px;
color:#9de2d0;
}

/* BUTTON */

.lab{
padding:20px;
}

button{
width:100%;
padding:16px;
background:#00e6a6;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
color:black;
}

button:hover{
background:#00c18d;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

<h1>NATIONAL BIO DEFENSE COMMAND</h1>
<div class="threat">Threat Level : GREEN</div>

</div>

<div class="map">
<div class="scan"></div>
</div>

<div class="dashboard">

<div class="card">
<div class="label">GLOBAL SURVEILLANCE</div>
<div class="big" id="nodes">16 Nodes Active</div>
</div>

<div class="card">
<div class="label">SYSTEM LOAD</div>
<div class="big" id="cpu">CPU 39%</div>
</div>

<div class="card">
<div class="label">DEFENSE NETWORK</div>
<div class="big">ONLINE</div>
</div>

<div class="card">
<div class="label">SYSTEM LOG</div>
<div class="log" id="log"></div>
</div>

</div>

<div class="lab">

<button onclick="enterLab()">ENTER BIO LAB</button>

</div>

<script>

/* nodes */

setInterval(()=>{

let n=14+Math.floor(Math.random()*6)

document.getElementById("nodes").innerText=n+" Nodes Active"

},4000)

/* cpu */

setInterval(()=>{

let cpu=30+Math.floor(Math.random()*20)

document.getElementById("cpu").innerText="CPU "+cpu+"%"

},3000)

/* logs */

let log=document.getElementById("log")

function addLog(){

let events=[
"Satellite node synced",
"Orbital scan completed",
"Bio sensor active",
"Threat analysis running",
"Neural network analyzing"
]

let e=events[Math.floor(Math.random()*events.length)]

let t=new Date().toLocaleTimeString()

log.innerHTML="[ "+t+" ] "+e+"<br>"+log.innerHTML

}

setInterval(addLog,2000)

/* lab */

function enterLab(){

window.location="lab.html"

}

</script>

</body>

</html>
