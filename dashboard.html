<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>National Bio Defense Command</title>

<style>

body{
margin:0;
font-family:Arial;
background:#000;
color:white;
}

/* video background */

video{
position:fixed;
right:0;
bottom:0;
min-width:100%;
min-height:100%;
z-index:-1;
opacity:0.25;
}

/* header */

header{
padding:30px;
border-bottom:2px solid #00ffc8;
}

h1{
margin:0;
font-size:32px;
}

.threat{
color:#00ffc8;
font-size:20px;
margin-top:5px;
}

/* grid */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
padding:25px;
}

.card{
background:rgba(0,60,60,0.6);
padding:25px;
border-radius:14px;
border:1px solid #00ffc8;
}

.card h3{
margin-top:0;
color:#9fffe0;
}

.big{
font-size:28px;
margin-top:10px;
}

/* log */

.log{
height:120px;
overflow:auto;
font-family:monospace;
font-size:13px;
}

/* button */

.enter{
margin:30px;
padding:18px;
width:calc(100% - 60px);
font-size:20px;
background:#00c896;
border:none;
border-radius:12px;
font-weight:bold;
}

.enter:hover{
background:#00a47b;
cursor:pointer;
}

.image-panel{
padding:25px;
}

.image-panel img{
width:100%;
border-radius:10px;
}

</style>
</head>

<body>

<!-- background video -->
<video autoplay muted loop>
<source src="https://cdn.coverr.co/videos/coverr-scientist-working-in-a-lab-5176/1080p.mp4">
</video>

<header>

<h1>NATIONAL BIO DEFENSE COMMAND</h1>
<div class="threat">Threat Level : GREEN</div>

</header>

<div class="grid">

<div class="card">
<h3>GLOBAL SURVEILLANCE</h3>
<div class="big" id="nodes">14 Nodes Active</div>
</div>

<div class="card">
<h3>SYSTEM LOAD</h3>
<div class="big" id="cpu">CPU 38%</div>
</div>

<div class="card">
<h3>DEFENSE NETWORK</h3>
<div class="big">ONLINE</div>
</div>

<div class="card">
<h3>SYSTEM LOG</h3>
<div class="log" id="log">
[15:44:21] Genome sample processing<br>
[15:44:23] Orbital scan completed<br>
[15:44:26] Bio shield monitoring<br>
</div>
</div>

</div>

<div class="image-panel">

<h2>Research Feed</h2>

<img src="https://images.unsplash.com/photo-1581091870627-3c4b8e9e5c9e">

</div>

<button class="enter" onclick="enterLab()">
ENTER BIO LAB
</button>

<script>

/* random cpu */

setInterval(()=>{
let cpu=Math.floor(Math.random()*40)+30
document.getElementById("cpu").innerText="CPU "+cpu+"%"
},3000)

/* logs */

setInterval(()=>{
let log=document.getElementById("log")
let time=new Date().toLocaleTimeString()
log.innerHTML+="<br>["+time+"] Lab sensor updated"
log.scrollTop=log.scrollHeight
},4000)

function enterLab(){
window.location="lab.html"
}

</script>

</body>
</html>
