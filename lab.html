<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Nexus Bio Lab – T-Virus Research</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#071a2b;
color:white;
}

.header{
background:#0a263f;
padding:18px;
font-size:18px;
font-weight:600;
}

/* DASHBOARD */

.container{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
padding:20px;
}

/* PANELS */

.panel{
background:#0f2f4a;
border-radius:12px;
padding:20px;
box-shadow:0 0 20px rgba(0,0,0,.4);
}

.title{
font-size:14px;
color:#8fb3d1;
margin-bottom:10px;
}

/* IMAGE */

.virus{
width:100%;
max-width:350px;
display:block;
margin:auto;
}

/* VIDEO */

video{
width:100%;
border-radius:10px;
}

/* MOBILE */

@media(max-width:800px){

.container{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="header">
🧬 Nexus Bio-Containment AI — T-Virus Laboratory
</div>

<div class="container">

<!-- DNA VIDEO -->

<div class="panel">

<div class="title">DNA GENOME VISUALIZATION</div>

<video autoplay loop muted playsinline>

<source src="assets/DNA.mp4" type="video/mp4">

</video>

</div>


<!-- VIRUS MODEL -->

<div class="panel">

<div class="title">VIRUS STRUCTURE MODEL</div>

<img class="virus" src="assets/virus-model-3d.png">

</div>


<!-- SPECIMEN DATA -->

<div class="panel">

<div class="title">SPECIMEN ANALYSIS</div>

Specimen ID : TV-023<br>
Virus Activity : 78%<br>
Mutation Index : 0.92<br>

</div>


<!-- INCUBATION -->

<div class="panel">

<div class="title">INCUBATION MONITOR</div>

Heart Rate : 82 bpm<br>
Temperature : 37.1°C<br>
Cell Status : Stable

</div>

</div>

</body>
</html>
