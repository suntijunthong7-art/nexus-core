<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexus Research Facility</title>

<style>

body{
font-family:Arial;
background:#f4f6f8;
margin:0;
padding:0;
}

.header{
background:#2e3f55;
color:white;
padding:20px;
font-size:22px;
}

.container{
padding:30px;
max-width:900px;
margin:auto;
}

.panel{
background:white;
border-radius:8px;
padding:20px;
margin-bottom:20px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.title{
font-weight:bold;
margin-bottom:10px;
}

.status{
color:green;
font-weight:bold;
}

button{
background:#2e3f55;
color:white;
border:none;
padding:10px 18px;
margin:5px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#162333;
}

</style>

</head>

<body>

<div class="header">
Nexus Research Facility
</div>

<div class="container">

<div class="panel">

<div class="title">Session Information</div>

User : Authorized Personnel<br>
Access Level : Level 4<br>
Location : Laboratory Core

</div>


<div class="panel">

<div class="title">Facility Systems</div>

Reactor Core : <span class="status">Operational</span><br>
Containment System : Stable<br>
Specimen Storage : Locked<br>
AI Monitoring : Active

</div>


<div class="panel">

<div class="title">Laboratory Controls</div>

<button onclick="alert('Research Database')">Research Database</button>
<button onclick="alert('Experiment Logs')">Experiment Logs</button>
<button onclick="alert('Personnel Records')">Personnel Records</button>
<button onclick="alert('Security System')">Security System</button>

</div>

</div>

</body>
</html>
