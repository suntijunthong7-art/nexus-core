<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Nexus Genome Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Segoe UI,Arial;
background:#071a2c;
color:white;
}

/* HEADER */

.header{
padding:18px;
background:#0a253d;
font-size:18px;
}

/* GRID LAYOUT */

.dashboard{
display:grid;
grid-template-columns:280px 1fr 280px;
gap:15px;
padding:15px;
}

/* PANEL */

.panel{
background:#0e2f4a;
border-radius:10px;
padding:15px;
}

/* CENTER DNA */

.center{
display:flex;
justify-content:center;
align-items:center;
}

/* DNA HELIX */

.dna{
position:relative;
width:120px;
height:320px;
}

.line{
position:absolute;
width:6px;
height:100%;
background:#41d6ff;
border-radius:4px;
animation:helix 4s infinite linear;
}

.line:nth-child(2){
left:60px;
animation-delay:2s;
}

@keyframes helix{

0%{transform:translateX(0)}
50%{transform:translateX(60px)}
100%{transform:translateX(0)}

}

canvas{
margin-top:10px;
max-height:120px;
}

/* MOBILE */

@media(max-width:900px){

.dashboard{
grid-template-columns:1fr;
}

.center{
order:-1;
}

}

</style>

</head>

<body>

<div class="header">
🧬 Nexus Genomics Research Console
</div>

<div class="dashboard">

<!-- LEFT PANEL -->

<div class="panel">

<h3>Specimen Data</h3>

Specimen : TV-023<br>
Activity : 78%<br>
Mutation : 0.92<br>
Containment : BSL-4

<canvas id="chart1"></canvas>

</div>


<!-- CENTER DNA -->

<div class="panel center">

<div class="dna">
<div class="line"></div>
<div class="line"></div>
</div>

</div>


<!-- RIGHT PANEL -->

<div class="panel">

<h3>Incubation Monitor</h3>

Heart rate : 82 bpm<br>
Temperature : 37.1°C<br>
Cell status : Stable

<canvas id="chart2"></canvas>

</div>


<!-- LEFT BOTTOM -->

<div class="panel">

<h3>Virus Structure</h3>

<img width="100%" src="https://upload.wikimedia.org/wikipedia/commons/3/3f/Coronavirus_virion_structure.svg">

</div>


<!-- RIGHT BOTTOM -->

<div class="panel">

<h3>Genome Analytics</h3>

RNA integrity : 94%<br>
Replication : 0.71

<canvas id="chart3"></canvas>

</div>

</div>

<script>

new Chart(document.getElementById("chart1"),{
type:"line",
data:{
labels:["0h","2h","4h","6h","8h"],
datasets:[{
data:[10,25,40,60,78],
borderColor:"#41d6ff",
fill:false
}]
},
options:{plugins:{legend:{display:false}}}
})


new Chart(document.getElementById("chart2"),{
type:"line",
data:{
labels:["0","1","2","3","4"],
datasets:[{
data:[40,48,52,50,55],
borderColor:"#7dffb2",
fill:false
}]
},
options:{plugins:{legend:{display:false}}}
})


new Chart(document.getElementById("chart3"),{
type:"line",
data:{
labels:["A","T","C","G"],
datasets:[{
data:[22,18,30,24],
borderColor:"#ffa94a",
fill:false
}]
},
options:{plugins:{legend:{display:false}}}
})

</script>

</body>
</html>
