<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Nexus Bio-Containment AI</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#020c14;
color:white;
overflow-x:hidden;
}

/* GRID LAB BACKGROUND */

body::before{

content:"";
position:fixed;
width:100%;
height:100%;
background-image:
linear-gradient(rgba(0,255,255,.05) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,255,255,.05) 1px,transparent 1px);

background-size:60px 60px;

z-index:-1;

}

/* HEADER */

.header{

background:#051b2c;
padding:20px;
font-size:18px;
font-weight:600;
border-bottom:1px solid rgba(0,255,255,.15);

}

/* CONTAINER */

.container{

padding:25px;
display:grid;
gap:25px;

}

/* PANELS */

.panel{

background:rgba(5,30,45,.85);
border-radius:14px;
padding:20px;

box-shadow:
0 0 25px rgba(0,255,255,.15),
inset 0 0 30px rgba(0,255,255,.05);

}

/* TITLE */

.title{

font-size:13px;
letter-spacing:.1em;
color:#7fdfff;
margin-bottom:14px;

}

/* VIDEO */

.videoFrame{

border-radius:12px;
overflow:hidden;
aspect-ratio:16/9;

border:1px solid rgba(0,255,255,.2);

}

video{

width:100%;
height:100%;
object-fit:cover;

}

/* VIRUS IMAGE */

.virus{

width:100%;
max-width:420px;
display:block;
margin:auto;

filter:drop-shadow(0 0 25px cyan);

}

/* SCAN EFFECT */

.scan{

position:relative;
overflow:hidden;

}

.scan::after{

content:"";
position:absolute;
width:100%;
height:2px;

background:cyan;

top:0;

animation:scan 4s infinite;

}

@keyframes scan{

0%{top:0}
50%{top:100%}
100%{top:0}

}

/* DATA */

.data{

line-height:1.8;
font-size:15px;

}

/* STATUS BAR */

.bar{

height:8px;
background:#042b40;
border-radius:4px;
overflow:hidden;
margin-top:6px;

}

.fill{

height:100%;
background:cyan;

}

</style>

</head>

<body>

<div class="header">
🧬 NEXUS AI — BIOHAZARD ANALYSIS SYSTEM
</div>

<div class="container">

<div class="panel scan">

<div class="title">DNA GENOME VISUALIZATION</div>

<div class="videoFrame">

<video autoplay loop muted playsinline>
<source src="dna.mp4" type="video/mp4">
</video>

</div>

</div>


<div class="panel scan">

<div class="title">VIRUS STRUCTURE MODEL</div>

<img class="virus" src="virus-model-3d.png">

</div>


<div class="panel">

<div class="title">SPECIMEN ANALYSIS</div>

<div class="data">

Specimen : TV-023

<div class="bar"><div class="fill" style="width:78%"></div></div>

Mutation Index : 0.92

<div class="bar"><div class="fill" style="width:92%"></div></div>

Containment : BSL-4

</div>

</div>


<div class="panel">

<div class="title">INCUBATION MONITOR</div>

<div class="data">

Heart Rate : 82 bpm  
Temperature : 37.1°C  
Cell Status : Stable

</div>

</div>

</div>

</body>
</html>
