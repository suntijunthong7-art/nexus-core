<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexus Genomics Lab</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#061320;
color:#e9eef6;
}

/* TOP BAR */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 20px;
background:#0a1c2e;
border-bottom:1px solid #1f3b55;
}

.logo{
font-weight:600;
}

.menu{
display:flex;
gap:14px;
font-size:13px;
opacity:.8;
}

/* DASHBOARD */

.dashboard{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:15px;
padding:15px;
}

/* PANEL */

.panel{
background:#0f2238;
border-radius:10px;
padding:15px;
border:1px solid rgba(255,255,255,.05);
}

.panel h3{
margin-top:0;
font-size:13px;
color:#9fb5cf;
}

/* GRAPH */

.graph{
height:100px;
background:linear-gradient(#1d3c5a,#0a1a2b);
border-radius:6px;
margin-top:10px;
}

/* CENTER DNA */

.center{
display:flex;
justify-content:center;
align-items:center;
}

.center img{
width:100%;
max-width:260px;
}

/* MOBILE */

@media(max-width:900px){

.dashboard{
grid-template-columns:1fr;
}

.menu{
display:none;
}

}

</style>

</head>

<body>

<div class="topbar">

<div class="logo">
🧬 Nexus Genomics Lab
</div>

<div class="menu">
<div>Overview</div>
<div>Genome Lab</div>
<div>Specimens</div>
<div>Incubation</div>
<div>Analytics</div>
</div>

</div>


<div class="dashboard">

<!-- LEFT -->

<div class="panel">

<h3>GENOME MAP</h3>

Specimen : VX-023<br>
Genome Activity : 78%<br>
AI Analysis : <span style="color:#63ff9a;">LOW RISK</span>

<div class="graph"></div>

</div>


<!-- CENTER -->

<div class="panel center">

<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/DNA_double_helix_horizontal.png/512px-DNA_double_helix_horizontal.png">

</div>


<!-- RIGHT -->

<div class="panel">

<h3>INCUBATION DATA</h3>

Heart Rate : 82 bpm<br>
Temperature : 37.1°C<br>
Cell Activity : Stable

<div class="graph"></div>

</div>

</div>

</body>
</html>
