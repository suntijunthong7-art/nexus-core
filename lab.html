<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Segoe UI;
background:#061320;
color:white;
}

/* header */

.header{
padding:18px;
font-size:20px;
font-weight:600;
background:#0a1c2e;
border-bottom:1px solid #1f3b55;
}

/* container */

.container{
padding:15px;
display:flex;
flex-direction:column;
gap:15px;
}

/* panel */

.panel{
background:#0f2238;
padding:18px;
border-radius:12px;
border:1px solid rgba(255,255,255,.05);
}

/* graph */

.graph{
height:110px;
border-radius:8px;
margin-top:10px;
background:linear-gradient(#1d3c5a,#0a1a2b);
}

/* DNA */

.dna-box{
display:flex;
justify-content:center;
}

svg{
width:120px;
height:260px;
filter:drop-shadow(0 0 10px #33cfff);
animation:spin 10s linear infinite;
}

@keyframes spin{
from{transform:rotateY(0deg);}
to{transform:rotateY(360deg);}
}

line{
stroke:#5ee6ff;
stroke-width:3;
}

circle{
fill:#5ee6ff;
}

</style>

</head>

<body>

<div class="header">
🧬 Nexus Genomics Lab
</div>

<div class="container">

<div class="panel">

<b>GENOME MAP</b><br><br>

Specimen : VX-023<br>
Genome Activity : 78%<br>
AI Analysis : <span style="color:#63ff9a">LOW RISK</span>

<div class="graph"></div>

</div>


<div class="panel dna-box">

<svg viewBox="0 0 100 300">

<line x1="30" y1="20" x2="70" y2="20"/>
<circle cx="30" cy="20" r="4"/>
<circle cx="70" cy="20" r="4"/>

<line x1="20" y1="60" x2="80" y2="60"/>
<circle cx="20" cy="60" r="4"/>
<circle cx="80" cy="60" r="4"/>

<line x1="30" y1="100" x2="70" y2="100"/>
<circle cx="30" cy="100" r="4"/>
<circle cx="70" cy="100" r="4"/>

<line x1="20" y1="140" x2="80" y2="140"/>
<circle cx="20" cy="140" r="4"/>
<circle cx="80" cy="140" r="4"/>

<line x1="30" y1="180" x2="70" y2="180"/>
<circle cx="30" cy="180" r="4"/>
<circle cx="70" cy="180" r="4"/>

<line x1="20" y1="220" x2="80" y2="220"/>
<circle cx="20" cy="220" r="4"/>
<circle cx="80" cy="220" r="4"/>

<line x1="30" y1="260" x2="70" y2="260"/>
<circle cx="30" cy="260" r="4"/>
<circle cx="70" cy="260" r="4"/>

</svg>

</div>


<div class="panel">

<b>INCUBATION DATA</b><br><br>

Heart Rate : 82 bpm<br>
Temperature : 37.1°C<br>
Cell Activity : Stable

<div class="graph"></div>

</div>

</div>

</body>
</html>
<!-- RIGHT -->

<div class="panel">

<h3>INCUBATION DATA</h3>

Heart Rate : 82 bpm<br>
Temperature : 37.1°C<br>
Cell Activity : Stable

<div class="graph"></div>

</div>

</div>

</body>
</html>
