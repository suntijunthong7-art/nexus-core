<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>System Boot</title>

<style>

body{
margin:0;
background:#020b10;
color:#72e4ff;
font-family:monospace;

display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

/* grid background */

body::before{
content:"";
position:absolute;
width:100%;
height:100%;

background-image:
linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);

background-size:50px 50px;
}

/* container */

.system{
text-align:center;
}

.logo{
font-size:26px;
letter-spacing:2px;
margin-bottom:30px;
}

/* progress */

.scan{
width:320px;
height:6px;
background:#031d25;
border:1px solid #0e4958;
margin:auto;
overflow:hidden;
}

.scanbar{
height:100%;
width:0%;
background:#00e1ff;
box-shadow:0 0 10px #00e1ff;
}

.percent{
margin-top:12px;
font-size:14px;
}

</style>

</head>

<body>

<div class="system">

<div class="logo">
VIRAL ANALYSIS SYSTEM
</div>

<div class="scan">
<div class="scanbar" id="bar"></div>
</div>

<div class="percent" id="percent">
Initializing...
</div>

</div>

<script>

let p = 0
let bar = document.getElementById("bar")
let percent = document.getElementById("percent")

let timer = setInterval(()=>{

p++

bar.style.width = p+"%"
percent.innerHTML = "System Loading "+p+"%"

if(p>=100){

clearInterval(timer)

percent.innerHTML="System Ready"

/* ตรวจสถานะ login */

let login = sessionStorage.getItem("login")

setTimeout(()=>{

if(login==="true"){

window.location.href="dashboard.html"

}else{

window.location.href="login.html"

}

},800)

}

},35)

</script>

</body>
</html>
