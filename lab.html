<!DOCTYPE html>
<html>
<head>

<title>Nexus Research Facility</title>

<style>

body{
font-family:Arial;
background:#f2f4f7;
margin:0;
padding:40px;
}

h1{
color:#2c3e50;
}

.panel{
background:white;
border-radius:8px;
padding:20px;
margin-top:20px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.status{
color:green;
}

button{
background:#2e3f55;
color:white;
border:none;
padding:10px 20px;
margin-right:10px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#162333;
}

</style>

</head>

<body>

<h1>Nexus Research Facility</h1>

<div class="panel">

Access Level : 4<br>
User Status : Authorized<br>
Location : Laboratory Core

</div>

<div class="panel">

<b>Lab Systems</b><br><br>

Reactor Core : <span class="status">Online</span><br>
Containment : Stable<br>
AI Monitor : Active<br>
Specimen Vault : Locked

</div>

<div class="panel">

<button>Database</button>
<button>Experiment Logs</button>
<button>Security Panel</button>

</div>

</body>
</html>
