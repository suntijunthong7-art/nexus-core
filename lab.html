<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>T-Virus Research Lab</title>

<style>
body{
    background:#0a0f14;
    color:#00ffcc;
    font-family:Arial, sans-serif;
    margin:0;
    text-align:center;
}

header{
    background:#05080c;
    padding:20px;
    border-bottom:2px solid #00ffcc;
}

h1{
    margin:0;
    letter-spacing:3px;
}

.lab-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:30px;
    padding:40px;
}

.panel{
    background:#0f1720;
    border:1px solid #00ffcc;
    border-radius:10px;
    padding:20px;
    box-shadow:0 0 15px #00ffcc33;
}

.panel img,
.panel video{
    width:100%;
    border-radius:8px;
}

.panel h2{
    margin-top:10px;
}
</style>

</head>
<body>

<header>
<h1>T-Virus Laboratory Database</h1>
<p>Biological Research Interface</p>
</header>

<div class="lab-container">

<div class="panel">
<video autoplay loop muted>
<source src="dna.mp4" type="video/mp4">
</video>
<h2>DNA Analysis</h2>
<p>Helix structure mutation sequence.</p>
</div>

<div class="panel">
<img src="virus-3d.png">
<h2>Virus 3D Model</h2>
<p>Three dimensional virus simulation.</p>
</div>

<div class="panel">
<img src="infected-cell.png">
<h2>Infected Cell</h2>
<p>Cellular infection stage under microscope.</p>
</div>

<div class="panel">
<video autoplay loop muted>
<source src="virus-structure.mp4" type="video/mp4">
</video>
<h2>Virus Structure</h2>
<p>Microscopic virus anatomy scan.</p>
</div>

</div>

</body>
</html>
