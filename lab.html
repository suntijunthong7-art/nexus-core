<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>T-Virus Research Laboratory</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#04151b;
color:#8feaff;
}

/* header */

header{
background:#0b2f38;
padding:15px 20px;
display:flex;
justify-content:space-between;
}

.status{
display:flex;
align-items:center;
gap:8px;
}

.dot{
width:10px;
height:10px;
border-radius:50%;
background:#2cff9c;
}

/* layout */

.container{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:16px;
}

.card{
background:#0c2530;
border:1px solid #10414e;
padding:14px;
}

/* genome */

.genome{
background:#000;
font-family:monospace;
color:#00ff9c;
height:80px;
overflow:hidden;
padding:8px;
font-size:13px;
}

/* sensor */

.sensor{
font-size:14px;
line-height:1.7;
}

/* terminal */

.terminal{
background:#000;
color:#00ff9c;
font-family:monospace;
height:150px;
overflow:auto;
padding:10px;
}

/* pulse */

.bpm{
font-size:26px;
text-align:center;
color:#2cff9c;
}

canvas{
width:100%;
height:140px;
}

/* graph full */

.graph{
grid-column:1/-1;
background:#0c2530;
padding:20px;
}

</style>

</head>

<body>

<header>

<div>T-Virus Bio Research System</div>

<div class="status">
<div class="dot"></div>
Laboratory Online
</div>

</header>

<div class="container">

<div class="card">

<h3>Genome Stream</h3>

<div class="genome" id="genome"></div>

</div>

<div class="card">

<h3>Bio Sensor Data</h3>

<div class="sensor">

Sample ID: TVX-2049<br>
Temperature: <span id="temp">37</span> °C<br>
pH Level: <span id="ph">7.2</span><br>
Viral Load: <span id="load">320</span> copies/ml

</div>

</div>

<div class="card">

<h3>Heart Monitor</h3>

<div class="bpm"><span id="bpm">72</span> BPM</div>

<canvas id="pulseChart"></canvas>

</div>

<div class="card">

<h3>Research Terminal</h3>

<div class="terminal" id="log"></div>

</div>

<div class="graph">

<h3>Virus Activity</h3>

<canvas id="virusChart"></canvas>

</div>

</div>

<script>

/* genome stream */

let genome=document.getElementById("genome")

let bases=["A","T","C","G"]

setInterval(()=>{

let seq=""

for(let i=0;i<60;i++){

seq+=bases[Math.floor(Math.random()*4)]

}

genome.innerHTML=seq+"<br>"+genome.innerHTML

},1200)


/* biosensor */

setInterval(()=>{

document.getElementById("temp").innerText=(36+Math.random()*2).toFixed(1)

document.getElementById("ph").innerText=(7+Math.random()*0.5).toFixed(2)

document.getElementById("load").innerText=Math.floor(Math.random()*500+200)

},3000)


/* virus graph */

let data=[5,10,15,20,25]

let chart=new Chart(document.getElementById("virusChart"),{

type:"line",

data:{
labels:["0h","2h","4h","6h","8h"],
datasets:[{
data:data,
borderColor:"#2cc6ff",
backgroundColor:"rgba(44,198,255,.2)",
fill:true
}]
},

options:{animation:false}

})

setInterval(()=>{

let v=Math.floor(Math.random()*40)+10

data.push(v)

data.shift()

chart.data.datasets[0].data=data

chart.update()

},3000)


/* pulse */

let pulse=[70,72,71,73,74]

let pulseChart=new Chart(document.getElementById("pulseChart"),{

type:"line",

data:{
labels:["","","","",""],
datasets:[{
data:pulse,
borderColor:"#00ff9c",
backgroundColor:"rgba(0,255,156,.2)",
fill:true
}]
},

options:{
animation:false,
plugins:{legend:{display:false}},
scales:{x:{display:false},y:{display:false}}
}

})

setInterval(()=>{

let bpm=70+Math.floor(Math.random()*15)

pulse.push(bpm)
pulse.shift()

pulseChart.data.datasets[0].data=pulse

pulseChart.update()

document.getElementById("bpm").innerText=bpm

},1500)


/* terminal */

let log=document.getElementById("log")

let msgs=[

"Scanning viral genome...",
"Mutation sequence detected",
"Protein binding process",
"Host cell infection mapping",
"Genome alignment running"

]

setInterval(()=>{

let t=new Date().toLocaleTimeString()

let m=msgs[Math.floor(Math.random()*msgs.length)]

log.innerHTML+="["+t+"] "+m+"<br>"

log.scrollTop=log.scrollHeight

},2000)

</script>

</body>
</html>
