<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ระบบตรวจสอบไวรัส</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f6f8;
color:#222;
}

/* header */

header{

background:#0b3d4a;
color:white;

display:flex;
justify-content:space-between;
align-items:center;

padding:12px 20px;

}

.status{

display:flex;
align-items:center;
gap:8px;

}

.dot{

width:10px;
height:10px;
border-radius:50%;

background:#2ecc71;

}

/* layout */

.container{

width:95%;
max-width:1100px;

margin:auto;
padding:20px 0;

}

.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:15px;

}

.card{

background:white;

border-radius:8px;

padding:15px;

box-shadow:0 2px 6px rgba(0,0,0,0.08);

}

.card h3{

margin:0 0 10px 0;
font-size:15px;

}

/* media */

img,video{

width:100%;
border-radius:6px;

}

/* radar */

.radar{

width:180px;
height:180px;

border:2px solid #0b3d4a;

border-radius:50%;

margin:auto;
position:relative;

overflow:hidden;

}

.scan{

position:absolute;

width:100%;
height:100%;

background:conic-gradient(
transparent 0deg,
rgba(11,61,74,.4) 40deg,
transparent 70deg
);

animation:spin 3s linear infinite;

}

@keyframes spin{

from{transform:rotate(0)}
to{transform:rotate(360deg)}

}

/* log */

.log{

background:#111;
color:#00ff9c;

font-family:monospace;

font-size:13px;

height:120px;

overflow:auto;

padding:10px;

}

/* graph */

.graph{

margin-top:25px;

background:white;

padding:20px;

border-radius:8px;

box-shadow:0 2px 6px rgba(0,0,0,0.08);

}

</style>

</head>

<body>

<header>

<div>
ระบบวิเคราะห์ไวรัส
</div>

<div class="status">

<div class="dot"></div>

กำลังทำงาน

</div>

</header>

<div class="container">

<div class="grid">

<div class="card">

<h3>DNA Visualization</h3>

<video autoplay loop muted>

<source src="dna.mp4">

</video>

</div>

<div class="card">

<h3>Virus Model</h3>

<img src="virus-3d.png">

</div>

<div class="card">

<h3>Cell Infection</h3>

<img src="infected-cell.png">

</div>

<div class="card">

<h3>Virus Structure</h3>

<video autoplay loop muted>

<source src="virus-structure.mp4">

</video>

</div>

<div class="card">

<h3>Particle Detection</h3>

<div class="radar">
<div class="scan"></div>
</div>

</div>

<div class="card">

<h3>System Log</h3>

<div class="log" id="log">

</div>

</div>

</div>

<div class="graph">

<canvas id="chart"></canvas>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

/* realtime graph */

let data=[5,8,12,18,25,32]

let chart=new Chart(document.getElementById("chart"),{

type:"line",

data:{
labels:["0","5","10","15","20","25"],
datasets:[{
label:"Viral Load",
data:data
}]
},

options:{
animation:false
}

})

setInterval(()=>{

let newValue=Math.floor(Math.random()*50)+20

data.push(newValue)

data.shift()

chart.update()

},3000)

/* realtime log */

let log=document.getElementById("log")

let messages=[

"กำลังตรวจสอบ RNA sequence",
"ตรวจพบโครงสร้างโปรตีน",
"วิเคราะห์การกลายพันธุ์",
"กำลังประมวลผลเซลล์โฮสต์",
"กำลังสแกนอนุภาคไวรัส"

]

setInterval(()=>{

let time=new Date().toLocaleTimeString()

let msg=messages[Math.floor(Math.random()*messages.length)]

log.innerHTML+="["+time+"] "+msg+"<br>"

log.scrollTop=log.scrollHeight

},2500)

</script>

</body>
</html>
