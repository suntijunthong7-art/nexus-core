<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T-Virus Monitoring Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#061a20;
color:#8feaff;
}

/* header */

header{
background:#0b2f38;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.status{
display:flex;
align-items:center;
gap:8px;
}

.dot{
width:10px;
height:10px;
border-radius:50%;
background:#2cff9c;
}

/* layout */

.container{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:16px;
}

.card{
background:#0c2530;
padding:14px;
border:1px solid #10414e;
}

img,video{
width:100%;
}

/* graph full width */

.graph{
grid-column:1/-1;
background:#0c2530;
padding:20px;
}

/* log */

.log{
background:#000;
color:#00ff9c;
font-family:monospace;
height:150px;
overflow:auto;
padding:10px;
}

/* pulse */

.bpm{
font-size:28px;
text-align:center;
color:#2cff9c;
margin-bottom:8px;
}

canvas{
width:100%;
height:150px;
}

</style>
</head>

<body>

<header>

<div>T-Virus Monitoring System</div>

<div class="status">
<div class="dot"></div>
System Active
</div>

</header>

<div class="container">

<div class="card">

<h3>DNA Structure</h3>

<video autoplay loop muted>
<source src="dna.mp4">
</video>

</div>

<div class="card">

<h3>T-Virus Model</h3>

<img src="virus-3d.png">

</div>

<div class="card">

<h3>Infected Cell</h3>

<img src="infected-cell.png">

</div>

<div class="card">

<h3>Virus Structure</h3>

<video autoplay loop muted>
<source src="virus-structure.mp4">
</video>

</div>

<div class="card">

<h3>Heart Rate Monitor</h3>

<div class="bpm"><span id="bpm">72</span> BPM</div>

<canvas id="pulseChart"></canvas>

</div>

<div class="card">

<h3>System Log</h3>

<div class="log" id="log"></div>

</div>

<div class="graph">

<h3>T-Virus Activity</h3>

<canvas id="virusChart"></canvas>

</div>

</div>

<script>

/* virus activity graph */

let virusData=[5,8,12,18,24,30]

let virusChart=new Chart(document.getElementById("virusChart"),{

type:"line",

data:{
labels:["0h","2h","4h","6h","8h","10h"],
datasets:[{
label:"Virus Activity",
data:virusData,
borderColor:"#2cc6ff",
backgroundColor:"rgba(44,198,255,.2)",
fill:true
}]
},

options:{
animation:false,
plugins:{
legend:{labels:{color:"#8feaff"}}
},
scales:{
x:{ticks:{color:"#8feaff"}},
y:{ticks:{color:"#8feaff"}}
}
}

})

setInterval(()=>{

let v=Math.floor(Math.random()*40)+10

virusData.push(v)
virusData.shift()

virusChart.data.datasets[0].data=virusData

virusChart.update()

},3000)

/* heart rate */

let pulseData=[70,72,71,73,75,72,74]

let pulseChart=new Chart(document.getElementById("pulseChart"),{

type:"line",

data:{
labels:["","","","","","",""],
datasets:[{

data:pulseData,

borderColor:"#00ff9c",

backgroundColor:"rgba(0,255,156,.2)",

tension:.4,

fill:true

}]

},

options:{
animation:false,
plugins:{legend:{display:false}},
scales:{
x:{display:false},
y:{display:false}
}
}

})

setInterval(()=>{

let bpm=70+Math.floor(Math.random()*15)

pulseData.push(bpm)
pulseData.shift()

pulseChart.data.datasets[0].data=pulseData

pulseChart.update()

document.getElementById("bpm").innerText=bpm

},1500)

/* system log */

let log=document.getElementById("log")

let msgs=[

"Scanning T-Virus genome",
"Analyzing mutation pattern",
"Protein binding detected",
"Host cell infection progressing",
"Sequence alignment running"

]

setInterval(()=>{

let t=new Date().toLocaleTimeString()

let m=msgs[Math.floor(Math.random()*msgs.length)]

log.innerHTML+="["+t+"] "+m+"<br>"

log.scrollTop=log.scrollHeight

},2500)

</script>

</body>
</html>
