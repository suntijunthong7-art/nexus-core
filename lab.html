<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus Genome Lab</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#030f19;
color:white;
}

/* HEADER */

.header{
padding:15px;
background:#071f33;
border-bottom:1px solid #173c55;
}

/* MAIN GRID */

.dashboard{

display:grid;
grid-template-columns:280px 1fr 280px;
gap:15px;
padding:15px;

}

/* PANELS */

.panel{

background:#0c2538;
padding:15px;
border-radius:10px;

}

/* CENTER DNA */

.center{
display:flex;
justify-content:center;
align-items:center;
}

.dna{

width:120px;
height:260px;
position:relative;

}

.strand{

position:absolute;
width:6px;
height:100%;
background:#3dd8ff;
border-radius:3px;
animation:helix 4s linear infinite;

}

.strand:nth-child(2){

left:60px;
animation-delay:2s;

}

@keyframes helix{

0%{transform:translateX(0)}
50%{transform:translateX(60px)}
100%{transform:translateX(0)}

}

.title{

font-size:13px;
color:#8fb3d1;
margin-bottom:10px;

}

/* GRAPH MOCK */

.graph{

height:70px;
background:linear-gradient(#183a56,#081a2b);
border-radius:6px;
margin-top:10px;

}

@media(max-width:900px){

.dashboard{
grid-template-columns:1fr;
}

.center{
order:-1;
}

}

</style>
</head>

<body>

<div class="header">
🧬 Nexus Genome Research Console
</div>

<div class="dashboard">

<!-- LEFT -->

<div class="panel">

<div class="title">SPECIMEN DATA</div>

Specimen : TV-023<br>
Virus activity : 78%<br>
Mutation index : 0.92

<div class="graph"></div>

</div>

<!-- CENTER -->

<div class="panel center">

<div class="dna">
<div class="strand"></div>
<div class="strand"></div>
</div>

</div>

<!-- RIGHT -->

<div class="panel">

<div class="title">INCUBATION DATA</div>

Heart rate : 82 bpm<br>
Temperature : 37.1°C<br>
Cell response : Stable

<div class="graph"></div>

</div>

<!-- BOTTOM LEFT -->

<div class="panel">

<div class="title">GENOME ANALYTICS</div>

RNA integrity : 94%<br>
Protein synthesis : Active

<div class="graph"></div>

</div>

<!-- BOTTOM RIGHT -->

<div class="panel">

<div class="title">VIRAL STRUCTURE</div>

<div style="
width:80px;
height:80px;
background:radial-gradient(circle,#38d6ff,#0a3555);
border-radius:50%;
margin:auto;
box-shadow:0 0 30px #38d6ff;
"></div>

</div>

</div>

</body>
</html>
