<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Nexus Bio Lab</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#03131f;
color:#e2edf7;
}

.header{
background:#072034;
padding:16px;
font-size:18px;
font-weight:600;
}

.container{
padding:15px;
display:flex;
flex-direction:column;
gap:15px;
}

.panel{
background:#0b253a;
padding:16px;
border-radius:12px;
}

img{
width:100%;
border-radius:10px;
}

canvas{
max-height:140px;
}

</style>
</head>

<body>

<div class="header">
🧬 Nexus Bio-Containment Lab
</div>

<div class="container">

<div class="panel">

<img src="images/virus.png">

</div>

<div class="panel">

Specimen : TV-023<br>
Virus activity : 78%<br>
Mutation index : 0.92<br>
Containment : Level-4

<canvas id="chart1"></canvas>

</div>

<div class="panel">

Heart rate : 82 bpm<br>
Temperature : 37.1°C<br>
Cell status : Stable

<canvas id="chart2"></canvas>

</div>

</div>

<script>

new Chart(document.getElementById("chart1"),{
type:"line",
data:{
labels:["0h","2h","4h","6h"],
datasets:[{
data:[10,25,40,60],
borderColor:"#2fd6ff",
fill:false
}]
},
options:{plugins:{legend:{display:false}}}
});

new Chart(document.getElementById("chart2"),{
type:"line",
data:{
labels:["0","1","2","3"],
datasets:[{
data:[40,48,52,50],
borderColor:"#63ff9a",
fill:false
}]
},
options:{plugins:{legend:{display:false}}}
});

</script>

</body>
</html>
