<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Nexus Viral Research System</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#0a1722;
color:white;
}

/* layout */

.container{
display:grid;
grid-template-columns:220px 1fr;
height:100vh;
}

/* sidebar */

.sidebar{
background:#0f2333;
padding:20px;
}

.sidebar h2{
font-size:16px;
margin-bottom:20px;
}

.sidebar a{
display:block;
color:#9bb2c4;
padding:10px;
text-decoration:none;
}

.sidebar a:hover{
background:#18374e;
}

/* main */

.main{
padding:20px;
display:grid;
grid-template-columns:repeat(3,1fr);
grid-auto-rows:220px;
gap:20px;
}

/* panels */

.panel{
background:#112a3b;
border-radius:8px;
padding:14px;
}

.panel h3{
font-size:13px;
color:#8aa5b8;
margin-bottom:10px;
}

/* big center panel */

.big{
grid-column:span 2;
grid-row:span 2;
display:flex;
align-items:center;
justify-content:center;
}

.big img{
width:90%;
}

/* charts */

canvas{
width:100%;
height:160px;
}

/* table */

table{
width:100%;
border-collapse:collapse;
font-size:13px;
}

td{
padding:6px;
border-bottom:1px solid #1f4057;
}

td:first-child{
color:#9bb2c4;
}

</style>
</head>

<body>

<div class="container">

<div class="sidebar">

<h2>Nexus Lab</h2>

<a href="#">Dashboard</a>
<a href="#">Genome Lab</a>
<a href="#">Viral Analysis</a>
<a href="#">Specimen</a>
<a href="#">AI Monitor</a>

</div>

<div class="main">

<div class="panel big">

<img src="virus-3d.png">

</div>

<div class="panel">

<h3>Virus Activity</h3>
<canvas id="chart1"></canvas>

</div>

<div class="panel">

<h3>Mutation Index</h3>
<canvas id="chart2"></canvas>

</div>

<div class="panel">

<h3>Specimen Status</h3>

<table>
<tr><td>ID</td><td>TV-023</td></tr>
<tr><td>Virus Activity</td><td>78%</td></tr>
<tr><td>Mutation Index</td><td>0.92</td></tr>
<tr><td>Containment</td><td>BSL-4</td></tr>
</table>

</div>

<div class="panel">

<h3>Incubation Monitor</h3>

<table>
<tr><td>Heart Rate</td><td>82 bpm</td></tr>
<tr><td>Temperature</td><td>37.1 °C</td></tr>
<tr><td>Cell Status</td><td>Stable</td></tr>
</table>

</div>

<div class="panel">

<h3>Genome Visualization</h3>

<video autoplay loop muted width="100%">
<source src="dna.mp4" type="video/mp4">
</video>

</div>

</div>

</div>

<script>

new Chart(document.getElementById("chart1"),{
type:"line",
data:{
labels:["0h","2h","4h","6h","8h"],
datasets:[{
label:"Virus",
data:[10,25,40,60,78]
}]
}
});

new Chart(document.getElementById("chart2"),{
type:"bar",
data:{
labels:["A","T","C","G"],
datasets:[{
label:"Genome",
data:[22,18,30,24]
}]
}
});

</script>

</body>
</html>
