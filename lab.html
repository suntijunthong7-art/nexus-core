<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Viral Structure Research Laboratory</title>

<style>

body{
background:#050e14;
color:#cfe7ff;
font-family:system-ui;
margin:0;
}

header{
background:#081821;
border-bottom:1px solid #1d445a;
padding:15px 25px;
display:flex;
align-items:center;
justify-content:space-between;
}

.header-left{
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:42px;
height:42px;
object-fit:contain;
}

.title{
font-size:20px;
letter-spacing:1px;
color:#79c9ff;
}

.status{
display:flex;
align-items:center;
gap:8px;
font-size:13px;
}

.dot{
width:10px;
height:10px;
border-radius:50%;
background:#00ff9c;
box-shadow:0 0 8px #00ff9c;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{opacity:0.4;}
50%{opacity:1;}
100%{opacity:0.4;}
}

.container{
width:92%;
max-width:1100px;
margin:auto;
padding:30px 0;
}

.card{
background:#081821;
border:1px solid #15394d;
border-radius:10px;
padding:20px;
margin-bottom:20px;
}

img,video{
width:100%;
border-radius:6px;
margin-top:10px;
}

</style>
</head>

<body>

<header>

<div class="header-left">

<img src="logo.png" class="logo">

<div class="title">
Viral Structure Research Laboratory
</div>

</div>

<div class="status">

<div class="dot"></div>
System Active

</div>

</header>

<div class="container">

<div class="card">

<h2>DNA Visualization</h2>

<video autoplay loop muted>
<source src="dna.mp4" type="video/mp4">
</video>

</div>

<div class="card">

<h2>Virus Structure Model</h2>

<img src="virus-3d.png">

</div>

<div class="card">

<h2>Infected Cell Observation</h2>

<img src="infected-cell.png">

</div>

<div class="card">

<h2>Virus Structure Animation</h2>

<video autoplay loop muted>
<source src="virus-structure.mp4" type="video/mp4">
</video>

</div>

</div>

</body>
</html>
