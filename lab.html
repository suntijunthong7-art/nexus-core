<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Boot</title>

<style>

body{
margin:0;
background:#03141a;
color:#7fdfff;
font-family:monospace;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:100vh;
}

.bar{
width:260px;
height:8px;
background:#0c2b34;
margin-top:20px;
}

.progress{
height:100%;
width:0%;
background:#00d9ff;
}

</style>
</head>

<body>

<h1>VIRAL ANALYSIS SYSTEM</h1>

<div class="bar">
<div class="progress" id="p"></div>
</div>

<p id="t">System Loading 0%</p>

<script>

let n=0

let p=document.getElementById("p")
let t=document.getElementById("t")

let load=setInterval(()=>{

n++

p.style.width=n+"%"

t.innerText="System Loading "+n+"%"

if(n>=100){

clearInterval(load)

window.location="dashboard.html"

}

},35)

</script>

</body>
</html>
