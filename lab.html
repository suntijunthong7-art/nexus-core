<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Nexus Bio-Containment Research Console</title>

<style>

:root{
--bg:#0b1d2b;
--panel:#132f45;
--border:#1f4c6b;
--accent:#4fb6e6;
--text:#e8f1f6;
--muted:#9fb4c3;
}

body{
margin:0;
font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
background:var(--bg);
color:var(--text);
}

/* header */

header{
padding:16px 22px;
background:#0f2b40;
border-bottom:1px solid var(--border);
font-weight:600;
letter-spacing:.02em;
}

/* layout */

.main{
padding:22px;
display:grid;
gap:22px;
max-width:1100px;
margin:auto;
}

/* panels */

.panel{
background:var(--panel);
border:1px solid var(--border);
border-radius:10px;
padding:18px;
}

.panel h2{
margin:0 0 12px 0;
font-size:13px;
letter-spacing:.1em;
color:var(--muted);
font-weight:600;
}

/* media frame */

.frame{
aspect-ratio:16/9;
background:#000;
border-radius:6px;
overflow:hidden;
border:1px solid var(--border);
}

.frame video,
.frame img{
width:100%;
height:100%;
object-fit:cover;
}

/* data table */

table{
width:100%;
border-collapse:collapse;
font-size:14px;
}

td{
padding:8px 4px;
border-bottom:1px solid var(--border);
}

td:first-child{
color:var(--muted);
width:55%;
}

/* responsive */

@media (min-width:900px){
.main{
grid-template-columns:1fr 1fr;
}
}

</style>
</head>

<body>

<header>
🧬 Nexus Bio-Containment AI — Viral Research Console
</header>

<div class="main">

<div class="panel">
<h2>DNA GENOME VISUALIZATION</h2>
<div class="frame">
<video autoplay muted loop playsinline>
<source src="dna.mp4" type="video/mp4">
</video>
</div>
</div>

<div class="panel">
<h2>VIRAL STRUCTURE MODEL</h2>
<div class="frame">
<img src="virus-3d.png">
</div>
</div>

<div class="panel">
<h2>SPECIMEN ANALYSIS</h2>

<table>
<tr><td>Specimen ID</td><td>TV-023</td></tr>
<tr><td>Virus Activity</td><td>78%</td></tr>
<tr><td>Mutation Index</td><td>0.92</td></tr>
<tr><td>Containment Level</td><td>BSL-4</td></tr>
</table>

</div>

<div class="panel">
<h2>INCUBATION MONITOR</h2>

<table>
<tr><td>Heart Rate</td><td>82 bpm</td></tr>
<tr><td>Temperature</td><td>37.1 °C</td></tr>
<tr><td>Cell Status</td><td>Stable</td></tr>
</table>

</div>

</div>

</body>
</html>
