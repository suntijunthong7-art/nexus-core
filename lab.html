<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Umbrella Bio Lab Console</title>

<style>

/* BACKGROUND */

body{

margin:0;
font-family:Segoe UI;
color:white;

background:
radial-gradient(circle at 50% 30%,#0b3d5c,#020b12);

overflow-x:hidden;

}

/* GRID OVERLAY */

body::before{

content:"";
position:fixed;
width:100%;
height:100%;

background-image:
linear-gradient(rgba(0,255,255,.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,255,255,.05) 1px, transparent 1px);

background-size:40px 40px;

pointer-events:none;

}

/* HEADER */

.header{

padding:20px;
background:#081f33;

box-shadow:0 0 30px rgba(0,200,255,.2);

font-weight:600;

}

/* DASHBOARD */

.container{

padding:24px;

display:grid;

gap:25px;

}

/* PANEL */

.panel{

background:rgba(10,35,55,.75);

border-radius:14px;

padding:22px;

border:1px solid rgba(0,255,255,.15);

box-shadow:

0 0 20px rgba(0,200,255,.15),
inset 0 0 20px rgba(0,150,255,.05);

backdrop-filter:blur(6px);

}

/* TITLE */

.title{

font-size:13px;

letter-spacing:.1em;

color:#7ec9ff;

margin-bottom:14px;

}

/* VIDEO */

.frame{

aspect-ratio:16/9;

overflow:hidden;

border-radius:10px;

box-shadow:0 0 25px rgba(0,200,255,.25);

}

video{

width:100%;
height:100%;
object-fit:cover;

}

/* VIRUS IMAGE */

.virus{

width:100%;

max-width:420px;

display:block;

margin:auto;

filter:

drop-shadow(0 0 20px rgba(0,255,255,.6))

drop-shadow(0 0 40px rgba(0,150,255,.4));

}

/* DATA */

.data{

line-height:1.8;

font-size:15px;

}

/* SCAN LINE */

.scan{

position:relative;

overflow:hidden;

}

.scan::after{

content:"";

position:absolute;

width:100%;

height:4px;

background:rgba(0,255,255,.5);

top:-10px;

animation:scan 4s linear infinite;

}

@keyframes scan{

0%{top:-10px}

100%{top:100%}

}

</style>

</head>

<body>

<div class="header">

🧬 Nexus Bio-Containment AI — T-Virus Research Console

</div>

<div class="container">

<div class="panel scan">

<div class="title">DNA GENOME SCAN</div>

<div class="frame">

<video autoplay loop muted playsinline>

<source src="dna.mp4" type="video/mp4">

</video>

</div>

</div>


<div class="panel">

<div class="title">VIRUS STRUCTURE MODEL</div>

<img class="virus" src="virus-model-3d.png">

</div>


<div class="panel">

<div class="title">SPECIMEN ANALYSIS</div>

<div class="data">

Specimen ID : TV-023<br>
Virus Activity : 78%<br>
Mutation Index : 0.92<br>
Containment Level : BSL-4

</div>

</div>


<div class="panel">

<div class="title">INCUBATION MONITOR</div>

<div class="data">

Heart Rate : 82 bpm<br>
Temperature : 37.1°C<br>
Cell Status : Stable

</div>

</div>

</div>

</body>
</html>
