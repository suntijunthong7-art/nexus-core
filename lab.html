<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>T-Virus Analysis System</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#061a20;
color:#8feaff;
}

/* header */

header{

background:#0b2f38;
padding:14px 20px;

display:flex;
justify-content:space-between;
align-items:center;

}

.status{

display:flex;
align-items:center;
gap:8px;

}

.dot{

width:10px;
height:10px;

border-radius:50%;

background:#2cff9c;

}

/* layout */

.container{

padding:20px;

display:grid;

grid-template-columns:repeat(auto-fit,minmax(260px,1fr));

gap:16px;

}

.card{

background:#0c2530;

padding:14px;

border:1px solid #10414e;

}

img,video{
width:100%;
}

/* graph */

.graph{

grid-column:1/-1;

background:#0c2530;

padding:20px;

}

canvas{
width:100%;
height:300px;
}

/* log */

.log{

background:#000;

color:#00ff9c;

font-family:monospace;

height:150px;

overflow:auto;

padding:10px;

margin-top:10px;

}

</style>
</head>

<body>

<header>

<div>T-Virus Monitoring System</div>

<div class="status">

<div class="dot"></div>
Active

</div>

</header>

<div class="container">

<div class="card">

<h3>DNA Structure</h3>

<video autoplay loop muted>
<source src="dna.mp4">
</video>

</div>

<div class="card">

<h3>T-Virus Model</h3>

<img src="virus-3d.png">

</div>

<div class="card">

<h3>Infected Cell</h3>

<img src="infected-cell.png">

</div>

<div class="card">

<h3>Virus Structure</h3>

<video autoplay loop muted>
<source src="virus-structure.mp4">
</video>

</div>

<div class="card">

<h3>System Log</h3>

<div class="log" id="log"></div>

</div>

<div class="graph">

<h3>T-Virus Mutation Graph</h3>

<canvas id="virusChart"></canvas>

</div>

</div>

<script>

/* graph */

let ctx=document.getElementById("virusChart")

let data=[5,8,12,18,24,30]

let chart=new Chart(ctx,{

type:"line",

data:{

labels:["0h","2h","4h","6h","8h","10h"],

datasets:[{

label:"T-Virus Activity",

data:data,

borderColor:"#2cc6ff",

backgroundColor:"rgba(44,198,255,.2)",

fill:true

}]

},

options:{

animation:false,

plugins:{
legend:{labels:{color:"#8feaff"}}
},

scales:{
x:{ticks:{color:"#8feaff"}},
y:{ticks:{color:"#8feaff"}}
}

}

})

/* realtime update */

setInterval(()=>{

let v=Math.floor(Math.random()*40)+10

data.push(v)

data.shift()

chart.data.datasets[0].data=data

chart.update()

},3000)


/* system log */

let log=document.getElementById("log")

let msgs=[

"Scanning T-Virus genome",
"Analyzing mutation pattern",
"Protein binding detected",
"Host cell infection progressing",
"Sequence alignment running"

]

setInterval(()=>{

let t=new Date().toLocaleTimeString()

let m=msgs[Math.floor(Math.random()*msgs.length)]

log.innerHTML+="["+t+"] "+m+"<br>"

log.scrollTop=log.scrollHeight

},2500)

</script>

</body>
</html>
