<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexus Genomics Lab</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#050e18;
color:white;
overflow:hidden;
}

/* TOP BAR */

.topbar{
position:absolute;
top:0;
left:0;
right:0;
height:60px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 30px;
background:rgba(0,0,0,.4);
border-bottom:1px solid rgba(255,255,255,.05);
}

.menu{
display:flex;
gap:20px;
font-size:14px;
opacity:.8;
}

/* PANELS */

.panel{
position:absolute;
background:rgba(20,40,65,.7);
border:1px solid rgba(255,255,255,.08);
border-radius:10px;
padding:15px;
backdrop-filter:blur(6px);
}

/* LEFT PANEL */

.left{
top:90px;
left:20px;
width:260px;
}

/* RIGHT PANEL */

.right{
top:90px;
right:20px;
width:260px;
}

/* GRAPH */

.graph{
height:100px;
margin-top:10px;
background:linear-gradient(180deg,#1d3c5a,#081b2e);
border-radius:6px;
}

canvas{
position:absolute;
top:0;
left:0;
}

</style>
</head>

<body>

<div class="topbar">

<div>Nexus Genomics Lab</div>

<div class="menu">
<div>Overview</div>
<div>Genome Lab</div>
<div>Specimens</div>
<div>Incubation</div>
<div>Analytics</div>
</div>

</div>

<div class="panel left">

<h3>Genome Map</h3>

Specimen ID : VX-023

<h2>78%</h2>

AI Analysis : <span style="color:#69ffb0;">LOW</span>

<div class="graph"></div>

</div>


<div class="panel right">

<h3>Specimen Monitoring</h3>

Heart Rate : 82 bpm  
Temperature : 37.1°C  
Cell Activity : Stable

<div class="graph"></div>

<h3>DNA Analytics</h3>

Sequence Match : 91%  
Mutation Index : 0.12  
Genome Stability : Stable

</div>


<script>

/* THREE JS */

const scene = new THREE.Scene()

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
)

const renderer = new THREE.WebGLRenderer({alpha:true})

renderer.setSize(window.innerWidth,window.innerHeight)

document.body.appendChild(renderer.domElement)

camera.position.z = 30

/* DNA HELIX */

const material = new THREE.MeshBasicMaterial({color:0x4fc3ff})

for(let i=0;i<50;i++){

const geometry = new THREE.SphereGeometry(.4)

const sphere = new THREE.Mesh(geometry,material)

const angle = i * 0.3

sphere.position.x = Math.cos(angle)*5
sphere.position.y = i*0.5 -10
sphere.position.z = Math.sin(angle)*5

scene.add(sphere)

}

function animate(){

requestAnimationFrame(animate)

scene.rotation.y += .003

renderer.render(scene,camera)

}

animate()

</script>

</body>
</html>
