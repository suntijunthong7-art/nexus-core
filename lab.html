<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Nexus Bio Lab</title>

<style>

body{
margin:0;
font-family:Segoe UI,Arial;
background:linear-gradient(180deg,#041421,#071f33);
color:white;
}

/* HEADER */

.header{
padding:18px;
font-size:18px;
font-weight:600;
background:#0b2a45;
border-bottom:1px solid rgba(255,255,255,.05);
}

/* LAYOUT */

.container{
padding:22px;
display:grid;
gap:24px;
}

/* PANEL */

.panel{
background:rgba(14,47,74,.8);
border-radius:14px;
padding:20px;
box-shadow:
0 0 30px rgba(0,0,0,.4),
inset 0 0 40px rgba(0,150,255,.05);
}

/* TITLE */

.title{
font-size:13px;
letter-spacing:.08em;
color:#9bbad4;
margin-bottom:14px;
}

/* VIDEO FRAME */

.videoFrame{

background:black;
border-radius:12px;
overflow:hidden;

box-shadow:
0 0 30px rgba(0,180,255,.2);

aspect-ratio:16/9;

}

video{
width:100%;
height:100%;
object-fit:cover;
}

/* IMAGE */

.virus{
width:100%;
max-width:380px;
display:block;
margin:auto;
filter:drop-shadow(0 0 25px rgba(0,200,255,.4));
}

/* DATA TEXT */

.data{
line-height:1.8;
font-size:15px;
}

</style>

</head>

<body>

<div class="header">
🧬 Nexus Bio-Containment AI — T-Virus Laboratory
</div>

<div class="container">

<div class="panel">

<div class="title">DNA GENOME VISUALIZATION</div>

<div class="videoFrame">

<video autoplay loop muted playsinline>
<source src="dna.mp4" type="video/mp4">
</video>

</div>

</div>


<div class="panel">

<div class="title">VIRUS STRUCTURE MODEL</div>

<img class="virus" src="virus-3d.png">

</div>


<div class="panel">

<div class="title">SPECIMEN ANALYSIS</div>

<div class="data">

Specimen ID : TV-023<br>
Virus Activity : 78%<br>
Mutation Index : 0.92<br>
Containment Level : BSL-4

</div>

</div>


<div class="panel">

<div class="title">INCUBATION MONITOR</div>

<div class="data">

Heart Rate : 82 bpm<br>
Temperature : 37.1°C<br>
Cell Status : Stable

</div>

</div>

</div>

</body>
</html>
