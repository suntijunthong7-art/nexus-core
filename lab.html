<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexus Research Facility</title>

<style>

body{
font-family:Arial;
background:#f4f6f8;
margin:0;
}

.header{
background:#2e3f55;
color:white;
padding:20px;
font-size:22px;
}

.container{
padding:30px;
max-width:900px;
margin:auto;
}

.panel{
background:white;
padding:20px;
border-radius:8px;
margin-bottom:20px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

button{
display:block;
width:250px;
padding:12px;
margin:12px 0;
background:#2e3f55;
color:white;
border:none;
border-radius:6px;
font-size:15px;
cursor:pointer;
}

button:hover{
background:#1e2c3d;
}


/* POPUP */

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
display:none;
align-items:center;
justify-content:center;
}

.popup-box{
background:white;
padding:25px;
border-radius:10px;
width:300px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.popup-box h3{
margin-top:0;
}

.close{
margin-top:15px;
background:#2e3f55;
}

</style>

</head>

<body>

<div class="header">
Nexus Research Facility
</div>

<div class="container">

<div class="panel">

<h3>Session Information</h3>

User : Authorized Personnel<br>
Access Level : Level 4<br>
Location : Laboratory Core

</div>

<div class="panel">

<h3>Facility Systems</h3>

Reactor Core : <span style="color:green">Operational</span><br>
Containment System : Stable<br>
Specimen Storage : Locked<br>
AI Monitoring : Active

</div>

<div class="panel">

<h3>Laboratory Controls</h3>

<button onclick="openPopup('Research Database')">Research Database</button>

<button onclick="openPopup('Experiment Logs')">Experiment Logs</button>

<button onclick="openPopup('Personnel Records')">Personnel Records</button>

<button onclick="openPopup('Security System')">Security System</button>

</div>

</div>


<!-- POPUP -->

<div class="popup" id="popup">

<div class="popup-box">

<h3 id="title">System</h3>

<p>Accessing module...</p>

<button class="close" onclick="closePopup()">Close</button>

</div>

</div>


<script>

function openPopup(name){

document.getElementById("title").innerText=name;
document.getElementById("popup").style.display="flex";

}

function closePopup(){

document.getElementById("popup").style.display="none";

}

</script>

</body>
</html>
