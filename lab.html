<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Nexus Genomics Dashboard</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#02131f;
color:#d6e5f5;
}

/* top bar */

.topbar{
height:60px;
background:#061f32;
display:flex;
align-items:center;
padding:0 20px;
border-bottom:1px solid #12364f;
}

.topbar h1{
font-size:16px;
margin:0;
}

/* grid dashboard */

.dashboard{
display:grid;
grid-template-columns:260px 1fr 260px;
grid-template-rows:auto 1fr;
gap:15px;
padding:15px;
height:calc(100vh - 60px);
}

/* panels */

.panel{
background:#0b2438;
border-radius:10px;
padding:15px;
border:1px solid rgba(255,255,255,.05);
}

/* center dna */

.center{
display:flex;
justify-content:center;
align-items:center;
}

/* DNA helix */

.dna{
position:relative;
height:320px;
width:140px;
}

.strand{
position:absolute;
width:6px;
height:100%;
background:#35d6ff;
left:50%;
transform-origin:center;
}

.strand:nth-child(1){
transform:rotateY(0deg);
animation:spin 6s linear infinite;
}

.strand:nth-child(2){
transform:rotateY(180deg);
animation:spin 6s linear infinite reverse;
}

@keyframes spin{
from{transform:rotateY(0deg)}
to{transform:rotateY(360deg)}
}

/* stat */

.stat{
margin-top:10px;
font-size:14px;
}

</style>
</head>

<body>

<div class="topbar">
<h1>🧬 Nexus Genomics — T-Virus Research</h1>
</div>

<div class="dashboard">

<!-- LEFT PANEL -->

<div class="panel">

<h3>GENOME MAP</h3>

<div class="stat">Specimen : TV-023</div>
<div class="stat">Genome Activity : 78%</div>
<div class="stat">Mutation Rate : 0.92</div>
<div class="stat">AI Status : LOW RISK</div>

</div>


<!-- CENTER DNA -->

<div class="panel center">

<div class="dna">

<div class="strand"></div>
<div class="strand"></div>

</div>

</div>


<!-- RIGHT PANEL -->

<div class="panel">

<h3>INCUBATION DATA</h3>

<div class="stat">Heart Rate : 82 bpm</div>
<div class="stat">Temperature : 37.1°C</div>
<div class="stat">Cell Activity : Stable</div>

</div>

</div>

</body>
</html>
