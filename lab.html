<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Nexus Bio-Containment AI</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#041320;
color:white;
overflow-x:hidden;
}

/* HEADER */

.header{
background:#0b2a45;
padding:18px;
font-size:18px;
}

/* BACKGROUND PARTICLES */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle,#0a4c6a 1px,transparent 1px);
background-size:40px 40px;
opacity:.15;
animation:move 40s linear infinite;
}

@keyframes move{
from{transform:translateY(0)}
to{transform:translateY(-200px)}
}

/* CONTAINER */

.container{
padding:20px;
display:grid;
gap:20px;
}

/* PANEL */

.panel{
background:#0e2f4a;
border-radius:12px;
padding:20px;
box-shadow:0 0 25px rgba(0,150,255,.2);
position:relative;
}

/* TITLE */

.title{
color:#8fb3d1;
font-size:13px;
margin-bottom:12px;
letter-spacing:.05em;
}

/* DNA VIDEO */

.videoBox{
position:relative;
border-radius:12px;
overflow:hidden;
}

video{
width:100%;
display:block;
}

/* SCAN LINE */

.videoBox::after{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:4px;
background:#4bd6ff;
box-shadow:0 0 20px #4bd6ff;
animation:scan 3s linear infinite;
}

@keyframes scan{
0%{top:0}
100%{top:100%}
}

/* VIRUS IMAGE */

img{
width:100%;
max-width:350px;
display:block;
margin:auto;
filter:drop-shadow(0 0 20px #2fd6ff);
}

</style>

</head>

<body>

<div class="header">
🧬 Nexus Bio-Containment AI — T-Virus Research
</div>

<div class="container">

<div class="panel">

<div class="title">DNA GENOME VISUALIZATION</div>

<div class="videoBox">

<video autoplay loop muted playsinline>
<source src="dna.mp4" type="video/mp4">
</video>

</div>

</div>


<div class="panel">

<div class="title">VIRUS STRUCTURE MODEL</div>

<img src="virus-model-3d.png">

</div>


<div class="panel">

<div class="title">SPECIMEN ANALYSIS</div>

Specimen ID : TV-023<br>
Virus Activity : 78%<br>
Mutation Index : 0.92<br>
Containment Level : BSL-4

</div>

</div>

</body>
</html>
