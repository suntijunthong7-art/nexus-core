<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Viral Laboratory System</title>

<style>

body{

margin:0;
background:#020b10;
color:#72e4ff;
font-family:monospace;

display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;

}

/* grid */

body::before{

content:"";
position:absolute;
width:100%;
height:100%;

background-image:
linear-gradient(rgba(0,255,255,0.06) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,255,255,0.06) 1px, transparent 1px);

background-size:50px 50px;

z-index:-1;

}

/* main */

.system{

text-align:center;

}

/* logo */

.logo{

font-size:26px;
letter-spacing:2px;
margin-bottom:30px;

}

/* scan bar */

.scan{

width:320px;
height:6px;
background:#031d25;
border:1px solid #0e4958;
margin:auto;
overflow:hidden;

}

.scanbar{

height:100%;
width:0%;

background:#00e1ff;

box-shadow:0 0 10px #00e1ff;

animation:load 4s linear forwards;

}

@keyframes load{

from{width:0}
to{width:100%}

}

/* percent */

.percent{

margin-top:12px;
font-size:14px;

}

</style>

</head>

<body>

<div class="system">

<div class="logo">

VIRAL ANALYSIS SYSTEM

</div>

<div class="scan">

<div class="scanbar"></div>

</div>

<div class="percent" id="percent">

Initializing...

</div>

</div>

<script>

let p=0;

let timer=setInterval(()=>{

p++

document.getElementById("percent").innerHTML="System Loading "+p+"%"

if(p>=100){

clearInterval(timer)

document.getElementById("percent").innerHTML="Accessing Laboratory Interface..."

setTimeout(()=>{

window.location.href="dashboard.html"

},1000)

}

},40)

</script>

</body>
</html>
