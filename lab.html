<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA Rotation Demo</title>

<style>

body{
margin:0;
background:#021421;
font-family:Segoe UI;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* container */

.lab{
text-align:center;
}

/* DNA helix */

.dna{
position:relative;
width:120px;
height:260px;
margin:auto;
}

/* nodes */

.node{
position:absolute;
width:10px;
height:10px;
border-radius:50%;
background:#37e0ff;
left:50%;
transform:translateX(-50%);
}

/* positions */

.node:nth-child(1){top:0;animation:left 4s infinite}
.node:nth-child(2){top:25px;animation:right 4s infinite}
.node:nth-child(3){top:50px;animation:left 4s infinite}
.node:nth-child(4){top:75px;animation:right 4s infinite}
.node:nth-child(5){top:100px;animation:left 4s infinite}
.node:nth-child(6){top:125px;animation:right 4s infinite}
.node:nth-child(7){top:150px;animation:left 4s infinite}
.node:nth-child(8){top:175px;animation:right 4s infinite}
.node:nth-child(9){top:200px;animation:left 4s infinite}

/* animation */

@keyframes left{
0%{transform:translateX(-40px)}
50%{transform:translateX(40px)}
100%{transform:translateX(-40px)}
}

@keyframes right{
0%{transform:translateX(40px)}
50%{transform:translateX(-40px)}
100%{transform:translateX(40px)}
}

</style>
</head>

<body>

<div class="lab">

<h2>🧬 Nexus Genomics DNA Model</h2>

<div class="dna">

<div class="node"></div>
<div class="node"></div>
<div class="node"></div>
<div class="node"></div>
<div class="node"></div>
<div class="node"></div>
<div class="node"></div>
<div class="node"></div>
<div class="node"></div>

</div>

</div>

</body>
</html>
