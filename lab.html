<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexus Genomics Lab</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Inter;
background:#060f1b;
color:#e8edf4;
}

/* TOP BAR */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 28px;
background:#0b1b2f;
border-bottom:1px solid #1e334a;
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-weight:600;
}

.menu{
display:flex;
gap:22px;
font-size:14px;
opacity:.85;
}

/* DASHBOARD */

.dashboard{
display:grid;
grid-template-columns:260px 1fr 300px;
gap:20px;
padding:25px;
}

/* PANEL STYLE */

.panel{
background:#0e1e32;
border-radius:10px;
padding:18px;
border:1px solid rgba(255,255,255,.05);
}

.panel h3{
margin-top:0;
font-size:13px;
letter-spacing:.05em;
color:#8fa6c0;
}

/* DATA BOX */

.data{
display:flex;
justify-content:space-between;
margin-top:8px;
font-size:14px;
}

/* GRAPH PLACEHOLDER */

.graph{
height:110px;
background:linear-gradient(180deg,#1a3553,#0c1d31);
border-radius:6px;
margin-top:12px;
}

/* DNA CENTER */

.center{
display:flex;
align-items:center;
justify-content:center;
position:relative;
}

.center img{
width:300px;
opacity:.95;
filter:drop-shadow(0 0 20px #3bbcff55);
}

/* ANALYTICS GRID */

.analytics{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:12px;
}

.card{
background:#13263e;
padding:12px;
border-radius:6px;
font-size:13px;
}

/* SMALL DNA GRAPH */

.small-dna{
width:100%;
margin-top:10px;
opacity:.85;
}

</style>
</head>

<body>

<div class="topbar">

<div class="logo">
🧬 Nexus Genomics Lab
</div>

<div class="menu">
<div>Overview</div>
<div>Genome Lab</div>
<div>Specimens</div>
<div>Incubation</div>
<div>Analytics</div>
</div>

</div>


<div class="dashboard">

<!-- LEFT -->

<div class="panel">

<h3>GENOME MAP</h3>

<div class="data">
<span>Specimen</span>
<span>VX-023</span>
</div>

<div class="data">
<span>Genome Activity</span>
<span>78%</span>
</div>

<div class="data">
<span>AI Analysis</span>
<span style="color:#64ff9c">LOW RISK</span>
</div>

<div class="graph"></div>

<div class="analytics">

<div class="card">
Mutation Rate<br>
<strong>0.12</strong>
</div>

<div class="card">
Genome Stability<br>
<strong>Stable</strong>
</div>

</div>

</div>


<!-- CENTER DNA -->

<div class="panel center">

<img src="https://upload.wikimedia.org/wikipedia/commons/9/9f/DNA_Overview.png">

</div>


<!-- RIGHT -->

<div class="panel">

<h3>INCUBATION DATA</h3>

<div class="data">
<span>Heart Rate</span>
<span>82 bpm</span>
</div>

<div class="data">
<span>Temperature</span>
<span>37.1°C</span>
</div>

<div class="data">
<span>Cell Activity</span>
<span>Stable</span>
</div>

<div class="graph"></div>

<h3 style="margin-top:16px;">DNA ANALYTICS</h3>

<img class="small-dna" src="https://upload.wikimedia.org/wikipedia/commons/4/4c/DNA_Structure%2BKey%2BLabelled.png">

</div>

</div>

</body>
</html>
