<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RED QUEEN CORE</title>

<style>

body{
background:#0a0f18;
color:#e6edf3;
font-family:Arial;
margin:0;
}

/* top bar */

.top{
background:#111827;
padding:15px;
font-size:20px;
font-weight:bold;
text-align:center;
letter-spacing:2px;
}

/* container */

.container{
padding:20px;
}

/* ai panel */

.ai{
background:#111827;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

.ai h2{
margin-top:0;
color:#ff4c4c;
}

/* system grid */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.card{
background:#162333;
padding:15px;
border-radius:10px;
}

.card h3{
margin-top:0;
}

/* console */

.console{
background:#000;
color:#00ff9c;
padding:15px;
height:180px;
overflow:auto;
font-family:monospace;
border-radius:10px;
}

/* buttons */

button{
width:100%;
padding:12px;
margin-top:10px;
background:#1f2937;
border:none;
color:white;
border-radius:6px;
font-size:15px;
}

button:hover{
background:#162333;
cursor:pointer;
}

.status-green{
color:#00ff9c;
}

.status-red{
color:#ff4c4c;
}

</style>
</head>

<body>

<div class="top">
RED QUEEN CONTROL CORE
</div>

<div class="container">

<div class="ai">
<h2>AI STATUS</h2>

<p>AI Unit : <span class="status-green">ONLINE</span></p>
<p>Facility Control : <span class="status-green">ACTIVE</span></p>
<p>Security Level : LEVEL 4</p>

</div>

<div class="grid">

<div class="card">
<h3>Facility Control</h3>

<button onclick="log('Reactor system check... OK')">
Check Reactor
</button>

<button onclick="log('Lab doors locked')">
Lock Laboratory
</button>

<button onclick="log('Emergency protocol armed')">
Emergency Protocol
</button>

</div>

<div class="card">
<h3>Security Systems</h3>

<button onclick="log('Camera network online')">
Camera Network
</button>

<button onclick="log('Biometric scan enabled')">
Biometric Scan
</button>

<button onclick="log('Security lockdown initiated')">
Full Lockdown
</button>

</div>

</div>

<br>

<div class="card">
<h3>Command Console</h3>

<div class="console" id="console">
> Red Queen AI Initialized<br>
> Awaiting command...
</div>
</div>

</div>

<script>

function log(text){

let consoleBox = document.getElementById("console");

consoleBox.innerHTML += "<br>> " + text;

consoleBox.scrollTop = consoleBox.scrollHeight;

}

</script>

</body>
</html>
