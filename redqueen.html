<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Red Queen AI Core</title>

<style>

body{
background:#050505;
color:#ff2a2a;
font-family:Courier New;
margin:0;
}

.header{
background:#120000;
padding:20px;
font-size:22px;
border-bottom:1px solid #ff0000;
}

.container{
padding:30px;
max-width:900px;
margin:auto;
}

.panel{
border:1px solid #ff0000;
padding:20px;
margin-bottom:20px;
background:#0a0000;
}

button{

width:260px;
padding:12px;
margin:10px 0;

background:#100000;
color:#ff3c3c;

border:1px solid #ff0000;

cursor:pointer;
font-family:Courier New;

}

button:hover{

background:#2a0000;

}

.popup{

position:fixed;
top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,0.8);

display:none;
align-items:center;
justify-content:center;

}

.popup-box{

background:#100000;
border:1px solid red;
padding:30px;
text-align:center;

}

</style>

</head>

<body>

<div class="header">
RED QUEEN AI CORE
</div>

<div class="container">

<div class="panel">

AI STATUS : ACTIVE  
Facility Security : ONLINE  
Containment System : STABLE  

</div>

<div class="panel">

<button onclick="openPopup('Accessing Research Database')">
Research Database
</button>

<button onclick="openPopup('Opening Experiment Logs')">
Experiment Logs
</button>

<button onclick="openPopup('Security System Control')">
Security System
</button>

<button onclick="openPopup('AI Core Diagnostics')">
AI Diagnostics
</button>

</div>

</div>

<div class="popup" id="popup">

<div class="popup-box">

<h3 id="title">SYSTEM</h3>

<p>Processing...</p>

<button onclick="closePopup()">Close</button>

</div>

</div>

<script>

function openPopup(name){

document.getElementById("title").innerText=name
document.getElementById("popup").style.display="flex"

}

function closePopup(){

document.getElementById("popup").style.display="none"

}

</script>

</body>
</html>
