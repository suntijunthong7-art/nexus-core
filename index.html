<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEXUS CORE SYSTEM</title>

<style>

body{
background:#0a0f18;
color:#9ecbff;
font-family:Arial;
margin:0;
}

/* top bar */

.top{
background:#111827;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
letter-spacing:2px;
}

/* main container */

.container{
padding:20px;
}

/* grid */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

/* card */

.card{
background:#162333;
padding:20px;
border-radius:10px;
}

.card h3{
margin-top:0;
}

/* button */

button{
width:100%;
padding:12px;
margin-top:10px;
background:#1f2937;
border:none;
color:white;
border-radius:6px;
font-size:15px;
}

button:hover{
background:#0f172a;
cursor:pointer;
}

/* status */

.green{
color:#00ff9c;
}

.yellow{
color:#ffd000;
}

.red{
color:#ff3b3b;
}

</style>
</head>

<body>

<div class="top">
NEXUS RESEARCH FACILITY
</div>

<div class="container">

<div class="grid">

<div class="card">

<h3>Session Information</h3>

<p>User : Authorized Personnel</p>
<p>Access Level : Level 4</p>
<p>Location : Laboratory Core</p>

</div>

<div class="card">

<h3>Facility Systems</h3>

<p>Reactor Core : <span class="green">Operational</span></p>
<p>Containment : <span class="green">Stable</span></p>
<p>Specimen Storage : <span class="yellow">Locked</span></p>
<p>AI Monitoring : <span class="green">Active</span></p>

</div>

</div>

<br>

<div class="card">

<h3>Laboratory Controls</h3>

<button onclick="location.href='dashboard.html'">
Research Database
</button>

<button onclick="location.href='lab.html'">
Laboratory Experiments
</button>

<button onclick="location.href='logs.html'">
Experiment Logs
</button>

<button onclick="location.href='security.html'">
Security System
</button>

<button onclick="location.href='redqueen.html'">
AI Core
</button>

</div>

</div>

</body>
</html>
