<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nexus Core Secure Portal</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0b2a2e,#042226);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:white;
width:340px;
padding:35px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.logo{
width:90px;
margin-bottom:10px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
background:#2f4158;
color:white;
font-size:16px;
}

button:disabled{
background:#888;
}

.status{
margin-top:15px;
color:#1c7a3d;
font-size:14px;
}

.error{
margin-top:10px;
color:red;
font-size:14px;
}

</style>
</head>

<body>

<div class="login-box">

<img src="logo.png" class="logo">

<h2>Nexus Core Secure Portal</h2>

<input id="user" placeholder="Username">

<input id="pass" type="password" placeholder="Password">

<button id="loginBtn" onclick="login()">SIGN IN</button>

<div id="error" class="error"></div>

<div class="status">
System Status : Secure Connection Active
</div>

</div>

<script>

let attempts = 0;
let lockTime = 30;

function login(){

let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u=="admin" && p=="Lc1234"){

location.href="lab.html";

}else{

attempts++;

if(attempts>=3){

lockSystem();

}else{

document.getElementById("error").innerText="ACCESS DENIED ("+attempts+"/3)";

}

}

}

function lockSystem(){

let btn=document.getElementById("loginBtn");
btn.disabled=true;

let timer=lockTime;

let interval=setInterval(function(){

document.getElementById("error").innerText="SYSTEM LOCKED "+timer+"s";

timer--;

if(timer<0){

clearInterval(interval);

attempts=0;
btn.disabled=false;
document.getElementById("error").innerText="";

}

},1000);

}

</script>

</body>
</html>
