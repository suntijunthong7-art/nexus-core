<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexus Core Secure Portal</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(180deg,#0b2a2e,#042226);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:white;
width:90%;
max-width:360px;
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
animation:fade 0.8s;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

.logo{
width:90px;
margin-bottom:10px;
}

h2{
margin:10px 0 20px 0;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
background:#2f4158;
color:white;
font-size:16px;
transition:0.3s;
}

button:hover{
background:#1d2c3f;
cursor:pointer;
}

button:active{
transform:scale(0.97);
}

.status{
margin-top:15px;
color:#1c7a3d;
font-size:14px;
}

.error{
margin-top:10px;
color:red;
font-size:14px;
min-height:18px;
}

.loading{
margin-top:10px;
font-size:14px;
color:#444;
display:none;
}

</style>

</head>

<body>

<div class="login-box">

<img src="logo.png" class="logo">

<h2>Nexus Core Secure Portal</h2>

<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">SIGN IN</button>

<div id="loading" class="loading">Verifying secure access...</div>

<div id="error" class="error"></div>

<div class="status">
System Status : Secure Connection Active
</div>

</div>

<script>

document.addEventListener("keydown",function(e){
if(e.key==="Enter"){
login();
}
});

function login(){

let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

document.getElementById("error").innerText="";
document.getElementById("loading").style.display="block";

setTimeout(function(){

if(u==="admin" && p==="Lc1234"){

sessionStorage.setItem("auth","true");

window.location.replace("dashboard.html");

}else{

document.getElementById("loading").style.display="none";
document.getElementById("error").innerText="ACCESS DENIED";

}

},900);

}

</script>

</body>
</html>
