<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEXUS LOGIN</title>

<style>

body{
background:#050b14;
color:#9ecbff;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#111827;
padding:40px;
border-radius:10px;
width:280px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin-top:10px;
background:#1f2937;
border:none;
color:white;
}

button{
width:100%;
padding:10px;
margin-top:15px;
background:#2563eb;
border:none;
color:white;
}

button:hover{
background:#1d4ed8;
}

</style>
</head>

<body>

<div class="box">

<h2>NEXUS CORE</h2>

<input id="user" placeholder="User">

<input id="pass" type="password" placeholder="Password">

<button onclick="login()">ACCESS</button>

</div>

<script>

function login(){

var u=document.getElementById("user").value;
var p=document.getElementById("pass").value;

if(u=="admin" && p=="Lc1234"){
location.href="dashboard.html";
}
else{
alert("Access Denied");
}

}

</script>

</body>
</html>
